<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesla Daily — TSLA</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0c0c0d;
      --fg: #f3f3f1;
      --muted: #8a8a86;
      --line: #2a2a2c;
      --chip: #3a3a3c;
      --up: #3ecf8e;
      --down: #e24b4b;
      --live-bg: #1f7a4d;
      --warn: #e6c56a;
      --spark: #8b8b87;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      padding: 32px 28px 48px;
    }

    .board {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr);
      gap: 0 0;
      width: min(1180px, 100%);
      margin: 0 auto;
      align-items: stretch;
    }

    .rule {
      background: var(--line);
      min-height: 100%;
    }

    .col-left { padding-right: 40px; }
    .col-right { padding-left: 40px; }

    .kicker {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .ticker {
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    .status {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      white-space: nowrap;
      line-height: 1;
    }

    .status.live {
      color: #fff;
      background: var(--live-bg);
      border-color: var(--live-bg);
    }

    .status.error { color: var(--warn); border-color: #6a5414; }
    .status.loading { color: var(--muted); }

    .clock {
      margin-top: 16px;
      font-size: 0.86rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      line-height: 1.45;
    }

    .clock .sep { margin: 0 0.35em; color: #5c5c58; }

    .clock .sess { color: var(--muted); font-weight: 650; letter-spacing: 0.06em; }
    .clock .sess.open { color: var(--up); }
    .clock .sess.pre { color: var(--warn); }

    .price-block { margin-top: 28px; }

    .label {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .price {
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.8rem, 7vw, 4.4rem);
      font-weight: 560;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .date {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    .spark {
      margin: 18px 0 4px;
      width: 100%;
      height: 52px;
    }

    .spark svg { display: block; width: 100%; height: 100%; }
    .spark:empty { display: none; }

    .today-block { margin-top: 22px; }

    .today-row {
      display: flex;
      align-items: baseline;
      gap: 18px;
    }

    .today-label {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 650;
    }

    .today-pct {
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.45rem, 3.4vw, 1.85rem);
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .today-block.up .today-label,
    .today-block.up .today-pct { color: var(--up); }
    .today-block.down .today-label,
    .today-block.down .today-pct { color: var(--down); }
    .today-block.flat .today-label { color: var(--muted); }
    .today-block.flat .today-pct { color: var(--fg); }

    .gap {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.92rem;
      font-variant-numeric: tabular-nums;
    }

    dl.facts {
      margin: 28px 0 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }

    dl.facts dt {
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.68rem;
      padding-top: 3px;
    }

    dl.facts dd {
      margin: 0;
      color: #d8d8d3;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .section-label {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 14px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--chip);
      border-radius: 999px;
      font-size: 0.86rem;
      color: var(--fg);
      line-height: 1.2;
      text-decoration: none;
    }

    a.chip:hover, a.tile:hover { border-color: #4a4a4c; }

    a.tile {
      text-decoration: none;
      color: inherit;
    }

    .voices a {
      color: inherit;
      text-decoration: none;
    }

    .voices a:hover { text-decoration: underline; }

    .chip .unverified {
      color: #7a7a76;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .stack-wrap { margin-top: 36px; }

    .stack {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .tile {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 96px;
      padding: 18px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .mark {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      color: var(--fg);
    }

    .mark svg { display: block; width: 100%; height: 100%; }

    .tile-body { min-width: 0; }

    .tile-name {
      font-size: 1.02rem;
      font-weight: 560;
      letter-spacing: -0.01em;
    }

    .tile-status {
      margin-top: 3px;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .voices {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .voices p {
      margin: 0;
      font-size: 0.95rem;
      color: #d8d8d3;
      line-height: 1.45;
    }

    .note {
      margin-top: 18px;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .note:empty { display: none; }
    .note.error { color: var(--warn); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      body { padding: 24px 18px 36px; }

      .board {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1px auto;
      }

      .rule { min-height: 1px; height: 1px; margin: 8px 0; }

      .col-left { padding-right: 0; padding-bottom: 28px; }
      .col-right { padding-left: 0; padding-top: 28px; }

      .stack { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 520px) {
      .stack { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="board">
    <section class="col-left">
      <div class="kicker">
        <div>
          <h1>Tesla Daily</h1>
          <div class="ticker">TSLA · NASDAQ</div>
        </div>
        <div id="status" class="status loading" aria-live="polite">Loading</div>
      </div>

      <div id="clock" class="clock">
        <span id="clock-hel">--:--</span> Helsinki
        <span class="sep">·</span>
        <span id="clock-ny">--:--</span> New York
        <span class="sep">·</span>
        <span id="clock-session" class="sess">—</span>
      </div>

      <div class="price-block">
        <div class="label">Last close</div>
        <div id="close-price" class="price" aria-busy="true">—</div>
        <div id="close-date" class="date"></div>
        <div id="spark" class="spark" aria-hidden="true"></div>
      </div>

      <div id="today-block" class="today-block flat">
        <div class="today-row">
          <div class="today-label">Today</div>
          <div id="change" class="today-pct">—</div>
        </div>
        <div id="gap" class="gap">—</div>
      </div>

      <dl class="facts">
        <dt>Overnight</dt>
        <dd id="overnight-value">—</dd>
        <dt>Live</dt>
        <dd id="live-value">—</dd>
        <dt>Quote time</dt>
        <dd id="when">—</dd>
        <dt>Source</dt>
        <dd id="meta">—</dd>
      </dl>
      <p id="note" class="note"></p>
    </section>

    <div class="rule" aria-hidden="true"></div>

    <section class="col-right">
      <h2 class="section-label">Show-me this week</h2>
      <div id="chips" class="chips"></div>

      <div class="stack-wrap">
        <h2 class="section-label">Musk stack</h2>
        <div id="stack" class="stack"></div>
      </div>

      <div class="voices">
        <h2 class="section-label">Voices</h2>
        <p id="voices">Wood / Baron / Ives — none today</p>
      </div>
    </section>
  </main>
  <p class="sr-only" id="live-region" aria-live="polite"></p>

  <script>
    (function () {
      const DEFAULT_SHOW_ME = [
        { label: "Cybercab", date: "3 Sep" },
        { label: "Broadcom", date: "Wed" },
        { label: "Starlink", unverified: true }
      ];
      const DEFAULT_STACK = [
        { name: "Tesla", status: "in session" },
        { name: "SpaceX", status: "no new post" },
        { name: "xAI", status: "quiet" },
        { name: "Optimus", status: "quiet" }
      ];
      const DEFAULT_VOICES = "Wood / Baron / Ives — none today";

      const MARKS = {
        Tesla: '<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M6 6h20v6H19v14h-6V12H6z"/></svg>',
        SpaceX: '<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 2.5l8.5 15.2h-5.1L16 29.5l-3.4-11.8H7.5z"/></svg>',
        xAI: '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="6" fill="#f3f3f1"/><path fill="#0c0c0d" d="M10 8h3.2L16 13.2 18.8 8H22l-4.4 7.2L22 22.4h-3.2L16 17.2 13.2 22.4H10l4.4-7.2z"/></svg>'
      };

      const el = {
        status: document.getElementById("status"),
        closePrice: document.getElementById("close-price"),
        closeDate: document.getElementById("close-date"),
        spark: document.getElementById("spark"),
        todayBlock: document.getElementById("today-block"),
        change: document.getElementById("change"),
        gap: document.getElementById("gap"),
        overnightValue: document.getElementById("overnight-value"),
        liveValue: document.getElementById("live-value"),
        when: document.getElementById("when"),
        meta: document.getElementById("meta"),
        note: document.getElementById("note"),
        liveRegion: document.getElementById("live-region"),
        chips: document.getElementById("chips"),
        stack: document.getElementById("stack"),
        voices: document.getElementById("voices"),
        clockHel: document.getElementById("clock-hel"),
        clockNy: document.getElementById("clock-ny"),
        clockSession: document.getElementById("clock-session")
      };

      function money(n) {
        return n.toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      function part(parts, type) {
        const p = parts.find(function (x) { return x.type === type; });
        return p ? p.value : "";
      }

      function formatHelsinki(date) {
        const parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Europe/Helsinki",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hourCycle: "h23"
        }).formatToParts(date);
        return part(parts, "hour") + ":" + part(parts, "minute") + ":" + part(parts, "second") + " "
          + part(parts, "day") + "." + part(parts, "month") + "." + part(parts, "year");
      }

      function formatHm(date, timeZone) {
        const parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: timeZone,
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).formatToParts(date);
        return part(parts, "hour") + ":" + part(parts, "minute");
      }

      function formatCloseDate(s) {
        if (s == null || s === "") return "";
        const m = String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return m[3] + "." + m[2] + "." + m[1];
        return String(s);
      }

      function parseUtc(s) {
        if (s == null || s === "") return null;
        const d = new Date(String(s));
        return Number.isNaN(d.getTime()) ? null : d;
      }

      function zonedWallToDate(year, monthIndex, day, hour, minute, timeZone) {
        const utcGuess = Date.UTC(year, monthIndex, day, hour, minute, 0);
        const fmt = new Intl.DateTimeFormat("en-US", {
          timeZone: timeZone,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hourCycle: "h23"
        });

        function offsetMs(ms) {
          const parts = fmt.formatToParts(new Date(ms));
          const asUTC = Date.UTC(
            Number(part(parts, "year")),
            Number(part(parts, "month")) - 1,
            Number(part(parts, "day")),
            Number(part(parts, "hour")),
            Number(part(parts, "minute")),
            Number(part(parts, "second"))
          );
          return asUTC - ms;
        }

        return new Date(utcGuess - offsetMs(utcGuess - offsetMs(utcGuess)));
      }

      function parseQuoteTimeEt(s) {
        if (s == null || s === "") return null;
        const m = String(s).trim().match(
          /^([A-Za-z]{3})\s+(\d{1,2}),\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)\s*ET$/i
        );
        if (!m) return null;
        const months = {
          Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5,
          Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11
        };
        const monthKey = m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase();
        const month = months[monthKey];
        if (month == null) return null;
        let hour = Number(m[4]);
        const ampm = m[6].toUpperCase();
        if (ampm === "PM" && hour !== 12) hour += 12;
        if (ampm === "AM" && hour === 12) hour = 0;
        return zonedWallToDate(Number(m[3]), month, Number(m[2]), hour, Number(m[5]), "America/New_York");
      }

      function quoteInstant(q) {
        return parseUtc(q.quote_time_utc) || parseQuoteTimeEt(q.quote_time_et);
      }

      function teslaSessionLabel() {
        const s = sessionFromClock(new Date());
        if (s === "OPEN") return "in session";
        if (s === "PREMARKET") return "premarket";
        return "closed";
      }

      function applyTeslaStatus() {
        if (!el.stack) return;
        el.stack.querySelectorAll(".tile").forEach(function (tile) {
          const name = tile.querySelector(".tile-name");
          const status = tile.querySelector(".tile-status");
          if (name && status && name.textContent === "Tesla") {
            status.textContent = teslaSessionLabel();
          }
        });
      }

      function tickClock() {
        const now = new Date();
        el.clockHel.textContent = formatHm(now, "Europe/Helsinki");
        el.clockNy.textContent = formatHm(now, "America/New_York");
        applyTeslaStatus();
      }

      function setSessionClock(session) {
        el.clockSession.className = "sess";
        if (session === "OPEN") {
          el.clockSession.textContent = "CASH OPEN";
          el.clockSession.classList.add("open");
        } else if (session === "PREMARKET") {
          el.clockSession.textContent = "PREMARKET";
          el.clockSession.classList.add("pre");
        } else {
          el.clockSession.textContent = "CLOSED";
        }
      }

      let sparkValues = [];

      function sparkSvg(values) {
        sparkValues = values || [];
        if (!sparkValues || sparkValues.length < 2) {
          el.spark.innerHTML = "";
          return;
        }
        const rect = el.spark.getBoundingClientRect();
        const w = Math.max(Math.round(rect.width) || 320, 160);
        const h = Math.max(Math.round(rect.height) || 52, 40);
        const padX = 7;
        const padY = 8;
        const min = Math.min.apply(null, sparkValues);
        const max = Math.max.apply(null, sparkValues);
        const span = max - min || 1;
        const pts = sparkValues.map(function (v, i) {
          const x = padX + (i / (sparkValues.length - 1)) * (w - padX * 2);
          const y = padY + (1 - (v - min) / span) * (h - padY * 2);
          return [x, y];
        });
        const lastDown = sparkValues[sparkValues.length - 1] < sparkValues[sparkValues.length - 2];
        const grey = pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
        let html = '<svg viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '" preserveAspectRatio="none">';
        if (lastDown) {
          const head = pts.slice(0, -1).map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
          html += '<polyline fill="none" stroke="#8b8b87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="' + head + '"/>';
          html += '<polyline fill="none" stroke="#e24b4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="'
            + pts[pts.length - 2][0].toFixed(1) + "," + pts[pts.length - 2][1].toFixed(1) + " "
            + pts[pts.length - 1][0].toFixed(1) + "," + pts[pts.length - 1][1].toFixed(1) + '"/>';
        } else {
          html += '<polyline fill="none" stroke="#8b8b87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="' + grey + '"/>';
        }
        pts.forEach(function (p, i) {
          const last = i === pts.length - 1;
          const fill = last && lastDown ? "#e24b4b" : "#8b8b87";
          html += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.7" fill="' + fill + '"/>';
        });
        html += "</svg>";
        el.spark.innerHTML = html;
      }

      function safeUrl(s) {
        if (s == null || s === "") return "";
        const u = String(s);
        if (u.indexOf("https://") === 0 || u.indexOf("http://") === 0) return u;
        return "";
      }

      function renderChips(items) {
        const list = (items && items.length) ? items : DEFAULT_SHOW_ME;
        el.chips.innerHTML = "";
        list.forEach(function (item) {
          const href = safeUrl(item && item.url);
          const chip = document.createElement(href ? "a" : "span");
          chip.className = "chip";
          if (href) {
            chip.href = href;
            chip.target = "_blank";
            chip.rel = "noopener";
          }
          const label = item && item.label != null ? String(item.label) : "";
          const date = item && item.date ? String(item.date) : "";
          chip.appendChild(document.createTextNode(date ? label + " " + date : label));
          if (item && item.unverified) {
            const tag = document.createElement("span");
            tag.className = "unverified";
            tag.textContent = "UNVERIFIED";
            chip.appendChild(tag);
          }
          el.chips.appendChild(chip);
        });
      }

      function renderStack(items) {
        const list = (items && items.length) ? items : DEFAULT_STACK;
        el.stack.innerHTML = "";
        list.forEach(function (item) {
          const name = item && item.name != null ? String(item.name) : "";
          const status = item && item.status != null && String(item.status) !== "" && String(item.status) !== "—" ? String(item.status) : "quiet";
          const href = safeUrl(item && item.url);
          const tile = document.createElement(href ? "a" : "div");
          tile.className = "tile";
          if (href) {
            tile.href = href;
            tile.target = "_blank";
            tile.rel = "noopener";
          }
          if (MARKS[name]) {
            const mark = document.createElement("div");
            mark.className = "mark";
            mark.innerHTML = MARKS[name];
            tile.appendChild(mark);
          }
          const body = document.createElement("div");
          body.className = "tile-body";
          const n = document.createElement("div");
          n.className = "tile-name";
          n.textContent = name;
          const s = document.createElement("div");
          s.className = "tile-status";
          s.textContent = status;
          body.appendChild(n);
          body.appendChild(s);
          tile.appendChild(body);
          el.stack.appendChild(tile);
        });
      }

      function renderMissing() {
        el.closePrice.textContent = "—";
        el.closePrice.setAttribute("aria-busy", "false");
        el.closeDate.textContent = "";
        el.spark.innerHTML = "";
        el.change.textContent = "—";
        el.todayBlock.className = "today-block flat";
        el.gap.textContent = "—";
        el.overnightValue.textContent = "—";
        el.liveValue.textContent = "—";
        el.when.textContent = "—";
        el.meta.textContent = "—";
        el.status.textContent = "Closed";
        el.status.className = "status error";
        setSessionClock("CLOSED");
        el.note.className = "note error";
        el.note.textContent = "The data file is missing.";
        el.liveRegion.textContent = "The data file is missing.";
        renderChips(DEFAULT_SHOW_ME);
        renderStack(DEFAULT_STACK);
        el.voices.textContent = DEFAULT_VOICES;
      }

      function render(q) {
        const lastClose = Number(q.last_close);
        if (!Number.isFinite(lastClose)) {
          renderMissing();
          return;
        }

        const overnight = q.overnight == null ? null : Number(q.overnight);
        const live = q.live == null ? null : Number(q.live);
        const hasOvernight = Number.isFinite(overnight);
        const hasLive = Number.isFinite(live);
        const session = String(q.session || "");

        el.closePrice.textContent = "$" + money(lastClose);
        el.closePrice.setAttribute("aria-busy", "false");
        el.closeDate.textContent = formatCloseDate(q.last_close_date);

        const series = Array.isArray(q.closes_5d)
          ? q.closes_5d.map(Number).filter(Number.isFinite)
          : [];
        sparkSvg(series.length ? series : [lastClose]);

        el.overnightValue.textContent = hasOvernight ? "$" + money(overnight) : "—";
        el.liveValue.textContent = hasLive ? "$" + money(live) : "—";

        let todayPx = null;
        if (session === "OPEN" && hasLive) todayPx = live;
        else if (hasOvernight) todayPx = overnight;

        if (todayPx != null && lastClose !== 0) {
          const diff = todayPx - lastClose;
          const pct = (diff / lastClose) * 100;
          const up = pct > 0.005;
          const down = pct < -0.005;
          const sign = up ? "+" : "";
          el.change.textContent = sign + pct.toFixed(2) + "%";
          el.todayBlock.className = "today-block " + (up ? "up" : down ? "down" : "flat");
          const gapSign = diff > 0.005 ? "+" : "−";
          const gapAbs = money(Math.abs(diff));
          el.gap.textContent = "$" + money(lastClose) + " → $" + money(todayPx)
            + " (" + (Math.abs(diff) < 0.005 ? "$0.00" : gapSign + "$" + gapAbs) + ")";
        } else {
          el.change.textContent = "—";
          el.todayBlock.className = "today-block flat";
          el.gap.textContent = "—";
        }

        if (session === "OPEN") {
          el.status.textContent = "Live";
          el.status.className = "status live";
        } else if (session === "PREMARKET") {
          el.status.textContent = "Overnight";
          el.status.className = "status";
        } else {
          el.status.textContent = "Closed";
          el.status.className = "status";
        }
        setSessionClock(session);

        const when = quoteInstant(q);
        el.when.textContent = when ? formatHelsinki(when) : "—";
        el.meta.textContent = q.source ? String(q.source) : "—";
        el.note.className = "note";
        el.note.textContent = "";

        renderChips(Array.isArray(q.show_me) ? q.show_me : null);
        renderStack(Array.isArray(q.musk_stack) ? q.musk_stack : null);
        applyTeslaStatus();
        const voiceText = q.voices ? String(q.voices) : DEFAULT_VOICES;
        const noneToday = /none today/i.test(voiceText);
        const vhref = noneToday ? "" : safeUrl(q.voices_url);
        el.voices.textContent = "";
        if (vhref) {
          const a = document.createElement("a");
          a.href = vhref;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = voiceText;
          el.voices.appendChild(a);
        } else {
          el.voices.textContent = voiceText;
        }

        const parts = ["TSLA last close $" + money(lastClose)];
        if (q.last_close_date) parts[0] += " (" + formatCloseDate(q.last_close_date) + ")";
        if (hasOvernight) parts.push("overnight $" + money(overnight));
        if (hasLive) parts.push("live $" + money(live));
        if (todayPx != null && lastClose !== 0) {
          const pct = ((todayPx - lastClose) / lastClose) * 100;
          const sign = pct > 0.005 ? "+" : "";
          parts.push("today " + sign + pct.toFixed(2) + "%");
        }
        el.liveRegion.textContent = parts.join(", ") + ".";
      }

      function nyParts(date) {
        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).formatToParts(date);
        return {
          weekday: part(parts, "weekday"),
          hour: Number(part(parts, "hour")),
          minute: Number(part(parts, "minute"))
        };
      }

      function sessionFromClock(date) {
        const ny = nyParts(date || new Date());
        const mins = ny.hour * 60 + ny.minute;
        const weekday = ["Mon", "Tue", "Wed", "Thu", "Fri"].indexOf(ny.weekday) >= 0;
        if (weekday && mins >= 9 * 60 + 30 && mins < 16 * 60) return "OPEN";
        if (weekday && mins >= 4 * 60 && mins < 9 * 60 + 30) return "PREMARKET";
        return "CLOSED";
      }

      function sessionFromMarketState(state) {
        if (state == null || state === "") return null;
        const s = String(state).toUpperCase();
        if (s === "REGULAR" || s === "OPEN") return "OPEN";
        if (s === "PRE" || s === "PREMARKET" || s === "PREPRE") return "PREMARKET";
        if (s === "POST" || s === "POSTPOST" || s === "CLOSED" || s === "CLOSE") return "CLOSED";
        return null;
      }

      function num(v) {
        if (typeof v === "number" && Number.isFinite(v)) return v;
        if (v && typeof v === "object" && Number.isFinite(Number(v.raw))) return Number(v.raw);
        const n = Number(v);
        return Number.isFinite(n) ? n : null;
      }

      function applyLive(base, data) {
        const next = Object.assign({}, base);
        const live = num(data.regularMarketPrice);
        const close = num(data.previousClose != null ? data.previousClose : data.regularMarketPreviousClose);
        if (live == null || close == null) return null;
        next.live = live;
        next.last_close = close;
        const mapped = sessionFromMarketState(data.marketState);
        next.session = mapped || sessionFromClock(new Date());
        next.quote_time_utc = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
        return next;
      }

      let quoteState = null;
      let refreshTimer = null;

      async function refreshLive() {
        if (!quoteState) return;
        try {
          const res = await fetch("https://finance-query.com/v2/quote/TSLA", { cache: "no-store" });
          if (!res.ok) throw new Error("live http");
          const data = await res.json();
          const payload = Array.isArray(data) ? data[0] : data;
          const next = applyLive(quoteState, payload || {});
          if (!next) throw new Error("live shape");
          quoteState = next;
          render(quoteState);
        } catch (err) {
          render(quoteState);
        }
        scheduleRefresh();
      }

      function scheduleRefresh() {
        if (refreshTimer) clearTimeout(refreshTimer);
        const open = quoteState && quoteState.session === "OPEN";
        refreshTimer = setTimeout(refreshLive, open ? 60000 : 5 * 60000);
      }

      async function load() {
        el.status.textContent = "Loading";
        el.status.className = "status loading";
        try {
          const res = await fetch("./quote.json", { cache: "no-store" });
          if (!res.ok) throw new Error("missing");
          quoteState = await res.json();
          render(quoteState);
          refreshLive();
        } catch (err) {
          renderMissing();
        }
      }

      tickClock();
      setInterval(tickClock, 1000);
      if (window.ResizeObserver) {
        new ResizeObserver(function () {
          if (sparkValues.length >= 2) sparkSvg(sparkValues);
        }).observe(el.spark);
      }
      load();
    })();
  </script>
</body>
</html>
