<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X DAILY — TSLA · SPCX</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="icon" href="./favicon.ico">
  <style>
    :root {
      --bg: #0c0c0d;
      --fg: #f3f3f1;
      --muted: #8a8a86;
      --line: #2a2a2c;
      --chip: #3a3a3c;
      --up: #3ecf8e;
      --down: #e24b4b;
      --live-bg: #1f7a4d;
      --warn: #e6c56a;
      --spark: #8b8b87;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      padding: 32px 28px 48px;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .pair {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: stretch;
    }

    .col-tsla {
      padding-right: 40px;
      border-right: 1px solid var(--line);
    }
    .col-spcx { padding-left: 40px; }

    .band {
      margin-top: 32px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .clock-bar {
      margin: 0 0 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      font-size: 0.86rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      line-height: 1.45;
    }
    .clock-bar .sep { margin: 0 0.35em; color: #5c5c58; }
    .clock-bar .sess { color: var(--muted); font-weight: 650; letter-spacing: 0.06em; }
    .clock-bar .sess.open { color: var(--up); }
    .clock-bar .sess.pre { color: var(--warn); }

    .kicker {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .ticker {
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    .status {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      white-space: nowrap;
      line-height: 1;
    }

    .status.live {
      color: #fff;
      background: var(--live-bg);
      border-color: var(--live-bg);
    }

    .status.error { color: var(--warn); border-color: #6a5414; }
    .status.loading { color: var(--muted); }

    .clock {
      margin-top: 16px;
      font-size: 0.86rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      line-height: 1.45;
    }

    .clock .sep { margin: 0 0.35em; color: #5c5c58; }

    .clock .sess { color: var(--muted); font-weight: 650; letter-spacing: 0.06em; }
    .clock .sess.open { color: var(--up); }
    .clock .sess.pre { color: var(--warn); }

    .price-block { margin-top: 28px; }

    .label {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .price {
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.8rem, 7vw, 4.4rem);
      font-weight: 560;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .date {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    .spark {
      display: block;
      margin: 18px 0 4px;
      width: 100%;
      height: 52px;
      min-height: 52px;
    }

    .spark svg { display: block; width: 100%; height: 100%; }
    .spark:empty { visibility: hidden; }

    .today-block { margin-top: 22px; }

    .today-row {
      display: flex;
      align-items: baseline;
      gap: 18px;
    }

    .today-label {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 650;
    }

    .today-pct {
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.45rem, 3.4vw, 1.85rem);
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .today-block.up .today-label,
    .today-block.up .today-pct { color: var(--up); }
    .today-block.down .today-label,
    .today-block.down .today-pct { color: var(--down); }
    .today-block.flat .today-label { color: var(--muted); }
    .today-block.flat .today-pct { color: var(--fg); }

    .gap {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.92rem;
      font-variant-numeric: tabular-nums;
    }

    dl.facts {
      margin: 28px 0 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }

    dl.facts dt {
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.68rem;
      padding-top: 3px;
    }

    dl.facts dd {
      margin: 0;
      color: #d8d8d3;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .section-label {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 14px;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    .chip, .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--chip);
      border-radius: 18px;
      font-size: 0.86rem;
      color: var(--fg);
      line-height: 1.2;
      text-decoration: none;
      box-sizing: border-box;
      text-align: center;
    }

    .chip:hover, .tile:hover { border-color: #4a4a4c; }

    .chip-name {
      font-weight: 560;
      color: var(--fg);
      text-decoration: none;
    }
    a.chip-name:hover { text-decoration: underline; }
    .chip-status {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
    }
    a.chip-status:hover { color: var(--fg); }
    .chip-status.dead { pointer-events: none; }
    .chip-date {
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .chip .unverified {
      color: #7a7a76;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }


    .headlines {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--chip);
    }

    .headlines li {
      border-bottom: 1px solid var(--chip);
      margin: 0;
      padding: 0;
    }

    .headline {
      display: block;
      padding: 10px 0;
      border: 0;
      border-radius: 0;
      color: var(--fg);
      text-decoration: none;
      line-height: 1.4;
      font-size: 0.95rem;
      font-weight: 450;
      box-sizing: border-box;
    }

    .headline:hover {
      color: #fff;
      text-decoration: underline;
    }

    .stack-wrap { margin-top: 0; }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .stack-row {
      display: grid;
      gap: 10px;
      width: 100%;
    }

    .stack-row.row-a { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stack-row.row-b { grid-template-columns: repeat(7, minmax(0, 1fr)); }


    .band, .voices, .chips, .stack, .stack-row {
      width: 100%;
      box-sizing: border-box;
    }

    .note {
      margin-top: 18px;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .note:empty { display: none; }
    .note.error { color: var(--warn); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      body { padding: 24px 18px 36px; }

      .pair { grid-template-columns: 1fr; }

      .col-tsla {
        padding-right: 0;
        padding-bottom: 28px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .col-spcx { padding-left: 0; padding-top: 28px; }
    }

    @media (max-width: 600px) {
      .chips,
      .stack-row.row-a,
      .stack-row.row-b { grid-template-columns: 1fr 1fr !important; }
    }
  </style>
</head>
<body>
  <main class="board">
    <div class="clock-bar" id="clock">
      <span id="clock-hel">--:--</span> Helsinki
      <span class="sep">·</span>
      <span id="clock-ny">--:--</span> New York
      <span class="sep">·</span>
      <span id="clock-session" class="sess">—</span>
    </div>
    <div class="pair">
    <section class="col-tsla">
      <div class="kicker">
        <div>
          <h1>X Daily</h1>
          <div class="ticker">TSLA · NASDAQ</div>

      <div class="price-block">

        <div id="spcx-price" class="price" aria-busy="true">—</div>
        <div id="spcx-date" class="date"></div>
        <div id="spcx-spark" class="spark" aria-hidden="true"></div>
      </div>

      <div id="spcx-today" class="today-block flat">

          <div class="today-label">Today</div>

      <dl class="facts">

        <dt>Live</dt>
        <dd id="spcx-live">—</dd>
        <dt id="spcx-fallback-term" hidden>Note</dt>

        <dd id="spcx-meta">—</dd>

    </div>

    <section class="band voices">
      <h2 class="section-label">Voices</h2>
      <div id="voices" class="chips"></div>
    </section>

    <section class="band">
      <h2 class="section-label">X News</h2>

  <p class="sr-only" id="live-region" aria-live="polite"></p>

  <script>
    (function () {
      const NONE_TODAY = "none today";
      const DEFAULT_STACK = [
        { label: "Tesla", url: "https://x.com/Tesla" },
        { label: "Energy", url: "https://x.com/Tesla" },
        { label: "Robotaxi", url: "https://x.com/Tesla" },
        { label: "Optimus", url: "https://x.com/Tesla" },
        { label: "SpaceX", url: "https://x.com/SpaceX" },
        { label: "Starlink", url: "https://x.com/Starlink" },
        { label: "Starship", url: "https://x.com/SpaceX" },
        { label: "xAI", url: "https://x.com/SpaceXAI" },
        { label: "X", url: "https://x.com/X" },
        { label: "Neuralink", url: "https://x.com/neuralink" },
        { label: "Boring", url: "https://x.com/boringcompany" }
      ];
      const DEFAULT_VOICES = [
        { label: "Elon", url: "https://x.com/elonmusk" },
        { label: "Wood", url: "https://x.com/CathieDWood" },
        { label: "Baron", url: "https://x.com/RonBaronAnalyst" },
        { label: "Ives", url: "https://x.com/DivesTech" }
      ];
      const STACK_ROW_A = ["Tesla", "Energy", "Robotaxi", "Optimus"];
      const LIVE_URL = {
        tsla: "https://finance-query.com/v2/quote/TSLA",
        spcx: "https://finance-query.com/v2/quote/SPCX"
      };

      function bindCard(prefix) {
        return {
          prefix: prefix,
          status: document.getElementById(prefix + "-status"),
          heroLabel: document.getElementById(prefix + "-hero-label"),
          price: document.getElementById(prefix + "-price"),
          date: document.getElementById(prefix + "-date"),
          lastCloseTerm: document.getElementById(prefix + "-last-close-term"),
          lastCloseValue: document.getElementById(prefix + "-last-close-value"),
          fallbackTerm: document.getElementById(prefix + "-fallback-term"),
          fallbackValue: document.getElementById(prefix + "-fallback-value"),
          spark: document.getElementById(prefix + "-spark"),
          todayBlock: document.getElementById(prefix + "-today"),
          change: document.getElementById(prefix + "-change"),
          gap: document.getElementById(prefix + "-gap"),
          overnightValue: document.getElementById(prefix + "-overnight"),
          liveValue: document.getElementById(prefix + "-live"),
          when: document.getElementById(prefix + "-when"),
          meta: document.getElementById(prefix + "-meta"),
          note: document.getElementById(prefix + "-note"),
          sparkValues: []
        };
      }

      const cards = {
        tsla: bindCard("tsla"),
        spcx: bindCard("spcx")
      };

      const el = {
        stack: document.getElementById("stack"),
        voices: document.getElementById("voices"),
        headlines: document.getElementById("headlines"),
        clockHel: document.getElementById("clock-hel"),
        clockNy: document.getElementById("clock-ny"),
        clockSession: document.getElementById("clock-session"),
        liveRegion: document.getElementById("live-region")
      };

      function money(n) {
        return n.toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      function part(parts, type) {
        const p = parts.find(function (x) { return x.type === type; });
        return p ? p.value : "";
      }

      function formatHelsinki(date) {
        const parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Europe/Helsinki",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hourCycle: "h23"
        }).formatToParts(date);
        return part(parts, "hour") + ":" + part(parts, "minute") + ":" + part(parts, "second") + " "
          + part(parts, "day") + "." + part(parts, "month") + "." + part(parts, "year");
      }

      function formatHm(date, timeZone) {
        const parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: timeZone,
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).formatToParts(date);
        return part(parts, "hour") + ":" + part(parts, "minute");
      }

      function formatCloseDate(s) {
        if (s == null || s === "") return "";
        const m = String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return m[3] + "." + m[2] + "." + m[1];
        return String(s);
      }

      function parseUtc(s) {
        if (s == null || s === "") return null;
        const d = new Date(String(s));
        return Number.isNaN(d.getTime()) ? null : d;
      }

      function zonedWallToDate(year, monthIndex, day, hour, minute, timeZone) {
        const utcGuess = Date.UTC(year, monthIndex, day, hour, minute, 0);
        const fmt = new Intl.DateTimeFormat("en-US", {
          timeZone: timeZone,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hourCycle: "h23"
        });
        function offsetMs(ms) {
          const parts = fmt.formatToParts(new Date(ms));
          const asUTC = Date.UTC(
            Number(part(parts, "year")),
            Number(part(parts, "month")) - 1,
            Number(part(parts, "day")),
            Number(part(parts, "hour")),
            Number(part(parts, "minute")),
            Number(part(parts, "second"))
          );
          return asUTC - ms;
        }
        return new Date(utcGuess - offsetMs(utcGuess - offsetMs(utcGuess)));
      }

      function parseQuoteTimeEt(s) {
        if (s == null || s === "") return null;
        const m = String(s).trim().match(
          /^([A-Za-z]{3})\s+(\d{1,2}),\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)\s*ET$/i
        );
        if (!m) return null;
        const months = {
          Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5,
          Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11
        };
        const monthKey = m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase();
        const month = months[monthKey];
        if (month == null) return null;
        let hour = Number(m[4]);
        const ampm = m[6].toUpperCase();
        if (ampm === "PM" && hour !== 12) hour += 12;
        if (ampm === "AM" && hour === 12) hour = 0;
        return zonedWallToDate(Number(m[3]), month, Number(m[2]), hour, Number(m[5]), "America/New_York");
      }

      function quoteInstant(q) {
        return parseUtc(q.quote_time_utc) || parseQuoteTimeEt(q.quote_time_et);
      }

      function teslaSessionLabel() {
        const s = sessionFromClock(new Date());
        if (s === "OPEN") return "in session";
        if (s === "PREMARKET") return "premarket";
        if (s === "AFTERHOURS") return "after hours";
        return "closed";
      }

      function applyTeslaStatus() {
        /* Musk stack status comes from pages opened this run, not the NY clock. */
      }

      function tickClock() {
        const now = new Date();
        el.clockHel.textContent = formatHm(now, "Europe/Helsinki");
        el.clockNy.textContent = formatHm(now, "America/New_York");
        applyTeslaStatus();
        setSessionClock(sessionFromClock(now));
      }

      function setSessionClock(session) {
        el.clockSession.className = "sess";
        if (session === "OPEN") {
          el.clockSession.textContent = "CASH OPEN";
          el.clockSession.classList.add("open");
        } else if (session === "PREMARKET") {
          el.clockSession.textContent = "PREMARKET";
          el.clockSession.classList.add("pre");
        } else if (session === "AFTERHOURS") {
          el.clockSession.textContent = "AFTER HOURS";
        } else {
          el.clockSession.textContent = "CLOSED";
        }
      }

      function sparkSvg(card, values) {
        card.sparkValues = values || [];
        if (!card.spark || !card.sparkValues || card.sparkValues.length < 2) {
          if (card.spark) card.spark.innerHTML = "";
          return;
        }
        const host = card.spark.parentElement || card.spark;
        const rect = host.getBoundingClientRect();
        const w = Math.max(Math.round(card.spark.clientWidth || rect.width) || 320, 160);
        const h = 52;
        const padX = 7;
        const padY = 8;
        const min = Math.min.apply(null, card.sparkValues);
        const max = Math.max.apply(null, card.sparkValues);
        const span = max - min || 1;
        const pts = card.sparkValues.map(function (v, i) {
          const x = padX + (i / (card.sparkValues.length - 1)) * (w - padX * 2);
          const y = padY + (1 - (v - min) / span) * (h - padY * 2);
          return [x, y];
        });
        const firstClose = card.sparkValues[0];
        const lastClose = card.sparkValues[card.sparkValues.length - 1];
        const spanPct = firstClose !== 0 ? ((lastClose - firstClose) / firstClose) * 100 : 0;
        const styles = getComputedStyle(document.documentElement);
        const upColor = (styles.getPropertyValue("--up") || "#3ecf8e").trim();
        const downColor = (styles.getPropertyValue("--down") || "#e24b4b").trim();
        const flatColor = (styles.getPropertyValue("--spark") || "#8b8b87").trim();
        let stroke = flatColor;
        if (spanPct > 0.005) stroke = upColor;
        else if (spanPct < -0.005) stroke = downColor;
        const ptsAttr = pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
        let html = '<svg viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '" preserveAspectRatio="none">';
        html += '<polyline fill="none" stroke="' + stroke + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="' + ptsAttr + '"/>';
        pts.forEach(function (p) {
          html += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.7" fill="' + stroke + '"/>';
        });
        html += "</svg>";
        card.spark.innerHTML = html;
      }

      function safeUrl(s) {
        if (s == null || s === "") return "";
        const u = String(s);
        if (u.indexOf("https://") === 0 || u.indexOf("http://") === 0) return u;
        return "";
      }

      function padButtons(items, minCount, maxCount, filler) {
        const src = Array.isArray(items) ? items.filter(Boolean) : [];
        const list = src.slice(0, maxCount);
        while (list.length < minCount) list.push(filler);
        return list;
      }

      function itemLabel(item) {
        if (!item) return "";
        if (item.label != null) return String(item.label);
        if (item.name != null) return String(item.name);
        return "";
      }

      function liveQuote(item) {
        if (!item) return "";
        const q = item.quote != null ? String(item.quote).trim() : "";
        const low = q.toLowerCase();
        if (!q || low === "quiet" || low === "none today" || low === "after hours" || q === "—") return "";
        return q;
      }

      function quoteDay(item) {
        const raw = item && item.quote_date != null ? String(item.quote_date).trim() : "";
        const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!m) return "";
        const iso = m[1] + "-" + m[2] + "-" + m[3];
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Europe/Helsinki",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());
        const today = part(parts, "year") + "-" + part(parts, "month") + "-" + part(parts, "day");
        if (iso === today) return "";
        return m[3] + "." + m[2];
      }

      function twoPartButton(item, emptyText, className) {
        const node = document.createElement("div");
        node.className = className || "chip";
        const home = safeUrl(item && item.url);
        const title = document.createElement(home ? "a" : "span");
        title.className = "chip-name";
        title.textContent = itemLabel(item);
        if (home) {
          title.href = home;
          title.target = "_blank";
          title.rel = "noopener";
        }
        node.appendChild(title);
        if (item && item.unverified) {
          const tag = document.createElement("span");
          tag.className = "unverified";
          tag.textContent = "UNVERIFIED";
          node.appendChild(tag);
        }
        const text = liveQuote(item);
        const qurl = text ? safeUrl(item && item.quote_url) : "";
        const q = document.createElement(qurl ? "a" : "span");
        q.className = "chip-status" + (qurl ? "" : " dead");
        q.textContent = text;
        if (qurl) {
          q.href = qurl;
          q.target = "_blank";
          q.rel = "noopener";
        }
        if (text) node.appendChild(q);
        const day = text ? quoteDay(item) : "";
        if (day) {
          const d = document.createElement("span");
          d.className = "chip-date";
          d.textContent = day;
          node.appendChild(d);
        }
        return node;
      }


      function makeChip(item) {
        return twoPartButton(item, "", "chip");
      }

      function renderChipRow(node, items, minCount, maxCount, filler) {
        const list = padButtons(items, minCount, maxCount, filler);
        node.innerHTML = "";
        node.style.gridTemplateColumns = "repeat(" + list.length + ", minmax(0, 1fr))";
        list.forEach(function (item) { node.appendChild(makeChip(item)); });
      }

      function makeTile(item) {
        return twoPartButton(item, "", "tile");
      }

      function renderStack(items) {
        const list = (items && items.length) ? items : DEFAULT_STACK;
        const byName = {};
        list.forEach(function (item) {
          const key = itemLabel(item);
          if (key) byName[key] = item;
        });
        const rowA = STACK_ROW_A.map(function (name) {
          return byName[name] || { label: name };
        });
        const rowB = list.filter(function (item) {
          return STACK_ROW_A.indexOf(itemLabel(item)) < 0;
        });
        el.stack.innerHTML = "";
        const a = document.createElement("div");
        a.className = "stack-row row-a";
        rowA.forEach(function (item) { a.appendChild(makeTile(item)); });
        const b = document.createElement("div");
        b.className = "stack-row row-b";
        rowB.forEach(function (item) { b.appendChild(makeTile(item)); });
        el.stack.appendChild(a);
        if (rowB.length) el.stack.appendChild(b);
      }


      function headlineDay(item) {
        const raw = item && (item.date || item.updated_at || item.quote_date);
        if (!raw) return "";
        const m = String(raw).match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!m) return "";
        return m[3] + "." + m[2];
      }

      function renderHeadlines(items) {
        const node = el.headlines;
        if (!node) return;
        node.innerHTML = "";
        const list = Array.isArray(items) ? items.filter(function (it) {
          return it && it.title && it.url;
        }).slice(0, 15) : [];
        if (!list.length) {
          const empty = document.createElement("li");
          empty.className = "note";
          empty.textContent = "No X News headlines yet.";
          node.appendChild(empty);
          return;
        }
        list.forEach(function (item) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.className = "headline";
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = item.title;
          li.appendChild(a);
          node.appendChild(li);
        });
      }

      function renderVoices(file) {
        let items = [];
        if (file && Array.isArray(file.voices)) items = file.voices.slice();
        const byLabel = {};
        items.forEach(function (item) {
          const key = itemLabel(item);
          if (key) byLabel[key] = item;
        });
        el.voices.innerHTML = "";
        el.voices.style.gridTemplateColumns = "repeat(4, minmax(0, 1fr))";
        DEFAULT_VOICES.forEach(function (base) {
          const item = Object.assign({}, base, byLabel[base.label] || {});
          if (!item.url) item.url = base.url;
          el.voices.appendChild(twoPartButton(item, "", "chip"));
        });
      }

      function blankCard(card, message) {
        card.price.textContent = "—";
        card.price.setAttribute("aria-busy", "false");
        card.date.textContent = "";
        card.spark.innerHTML = "";
        card.change.textContent = "—";
        card.todayBlock.className = "today-block flat";
        card.gap.textContent = "—";
        card.overnightValue.textContent = "—";
        card.liveValue.textContent = "—";
        card.when.textContent = "—";
        card.meta.textContent = "—";
        card.status.textContent = "Closed";
        card.status.className = "status error";
        card.note.className = "note error";
        card.note.textContent = message || "The data file is missing.";
        card.lastCloseTerm.hidden = true;
        card.lastCloseValue.hidden = true;
        card.fallbackTerm.hidden = true;
        card.fallbackValue.hidden = true;
      }

      function renderCard(card, q) {
        if (!q) {
          blankCard(card, "No quote yet.");
          return;
        }
        const lastClose = Number(q.last_close);
        if (!Number.isFinite(lastClose)) {
          blankCard(card, "The data file is missing.");
          return;
        }

        const overnight = q.overnight == null ? null : Number(q.overnight);
        const live = q.live == null ? null : Number(q.live);
        const afterHours = q.after_hours == null ? null : Number(q.after_hours);
        const hasOvernight = Number.isFinite(overnight);
        const hasLive = Number.isFinite(live);
        const hasAfter = Number.isFinite(afterHours);
        const session = sessionFromClock(new Date());

        let hero = lastClose;
        let heroLabel = "Last close";
        let fallback = "";
        if (session === "PREMARKET") {
          if (hasOvernight) { hero = overnight; heroLabel = "Premarket"; }
          else { fallback = "No premarket quote. Showing last close."; }
        } else if (session === "OPEN") {
          if (hasLive) { hero = live; heroLabel = "Live"; }
          else { fallback = "No live quote. Showing last close."; }
        } else if (session === "AFTERHOURS") {
          if (hasAfter) { hero = afterHours; heroLabel = "After hours"; }
          else { hero = lastClose; heroLabel = "After hours"; }
        }

        card.heroLabel.textContent = heroLabel;
        card.price.textContent = "$" + money(hero);
        card.price.setAttribute("aria-busy", "false");
        card.date.textContent = heroLabel === "Last close" ? formatCloseDate(q.last_close_date) : "";

        const showLastFact = heroLabel !== "Last close";
        card.lastCloseTerm.hidden = !showLastFact;
        card.lastCloseValue.hidden = !showLastFact;
        card.lastCloseValue.textContent = showLastFact ? "$" + money(lastClose) : "—";
        card.fallbackTerm.hidden = !fallback;
        card.fallbackValue.hidden = !fallback;
        card.fallbackTerm.textContent = fallback ? "Note" : "";
        card.fallbackValue.textContent = fallback;

        const series = Array.isArray(q.closes_5d)
          ? q.closes_5d.map(Number).filter(Number.isFinite)
          : [];
        sparkSvg(card, series);

        card.overnightValue.textContent = hasOvernight ? "$" + money(overnight) : "—";
        card.liveValue.textContent = hasLive ? "$" + money(live) : "—";

        let todayPx = null;
        if (session === "PREMARKET") todayPx = hasOvernight ? overnight : null;
        else if (session === "OPEN") todayPx = hasLive ? live : null;
        else if (session === "AFTERHOURS") todayPx = hasAfter ? afterHours : lastClose;
        else todayPx = hasAfter ? afterHours : lastClose;

        if (todayPx != null && lastClose !== 0) {
          const diff = todayPx - lastClose;
          const pct = (diff / lastClose) * 100;
          const up = pct > 0.005;
          const down = pct < -0.005;
          const sign = up ? "+" : "";
          card.change.textContent = sign + pct.toFixed(2) + "%";
          card.todayBlock.className = "today-block " + (up ? "up" : down ? "down" : "flat");
          const gapSign = diff > 0.005 ? "+" : "−";
          const gapAbs = money(Math.abs(diff));
          card.gap.textContent = "$" + money(lastClose) + " → $" + money(todayPx)
            + " (" + (Math.abs(diff) < 0.005 ? "$0.00" : gapSign + "$" + gapAbs) + ")";
        } else {
          card.change.textContent = "—";
          card.todayBlock.className = "today-block flat";
          card.gap.textContent = "—";
        }

        if (session === "OPEN") {
          card.status.textContent = "Live";
          card.status.className = "status live";
        } else if (session === "PREMARKET") {
          card.status.textContent = "Premarket";
          card.status.className = "status";
        } else if (session === "AFTERHOURS") {
          card.status.textContent = "After hours";
          card.status.className = "status";
        } else {
          card.status.textContent = "Last close";
          card.status.className = "status";
        }

        const when = quoteInstant(q);
        card.when.textContent = when ? formatHelsinki(when) : "—";
        card.meta.textContent = q.source ? String(q.source) : "—";
        card.note.className = "note";
        card.note.textContent = "";
      }

      function nyParts(date) {
        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).formatToParts(date);
        return {
          weekday: part(parts, "weekday"),
          hour: Number(part(parts, "hour")),
          minute: Number(part(parts, "minute"))
        };
      }

      function sessionFromClock(date) {
        const ny = nyParts(date || new Date());
        const mins = ny.hour * 60 + ny.minute;
        const weekday = ["Mon", "Tue", "Wed", "Thu", "Fri"].indexOf(ny.weekday) >= 0;
        if (!weekday) return "CLOSED";
        if (mins >= 4 * 60 && mins < 9 * 60 + 30) return "PREMARKET";
        if (mins >= 9 * 60 + 30 && mins < 16 * 60) return "OPEN";
        if (mins >= 16 * 60 && mins < 20 * 60) return "AFTERHOURS";
        return "CLOSED";
      }

      function num(v) {
        if (typeof v === "number" && Number.isFinite(v)) return v;
        if (v && typeof v === "object" && Number.isFinite(Number(v.raw))) return Number(v.raw);
        const n = Number(v);
        return Number.isFinite(n) ? n : null;
      }

      function nyYmd(date) {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/New_York",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(date);
        return part(parts, "year") + "-" + part(parts, "month") + "-" + part(parts, "day");
      }

      function epochToNyYmd(epoch) {
        const n = Number(epoch);
        if (!Number.isFinite(n) || n <= 0) return null;
        const ms = n < 1e12 ? n * 1000 : n;
        return nyYmd(new Date(ms));
      }

      function priorNyWeekday(ymd) {
        const bits = String(ymd).split("-").map(Number);
        let t = Date.UTC(bits[0], bits[1] - 1, bits[2], 16, 0, 0) - 24 * 3600 * 1000;
        for (let i = 0; i < 8; i++) {
          const dt = new Date(t);
          const ny = nyParts(dt);
          if (["Mon", "Tue", "Wed", "Thu", "Fri"].indexOf(ny.weekday) >= 0) return nyYmd(dt);
          t -= 24 * 3600 * 1000;
        }
        return ymd;
      }

      function appendCloseIfNew(q, price, date) {
        if (!Number.isFinite(price) || !date) return;
        if (q.last_close_date === date) return;
        const series = Array.isArray(q.closes_5d) ? q.closes_5d.map(Number).filter(Number.isFinite) : [];
        series.push(price);
        q.closes_5d = series.slice(-5);
      }

      function applyLastClose(next, data, session) {
        const prev = num(data.previousClose != null ? data.previousClose : data.regularMarketPreviousClose);
        const cash = num(data.regularMarketPrice);
        const cashDate = epochToNyYmd(data.regularMarketTime);
        const todayNy = nyYmd(new Date());
        if (session === "AFTERHOURS" || session === "CLOSED") {
          if (cash != null) {
            appendCloseIfNew(next, cash, cashDate || todayNy);
            next.last_close = cash;
            if (cashDate) next.last_close_date = cashDate;
          }
        } else {
          if (prev != null) next.last_close = prev;
          if (!next.last_close_date || next.last_close_date >= todayNy) {
            next.last_close_date = (cashDate && cashDate < todayNy) ? cashDate : priorNyWeekday(todayNy);
          } else if (cashDate && next.last_close_date < cashDate && cashDate < todayNy) {
            next.last_close_date = cashDate;
          }
        }
        if ((session === "AFTERHOURS" || session === "CLOSED") && cashDate && (!next.last_close_date || next.last_close_date < cashDate)) {
          next.last_close_date = cashDate;
        }
      }

      function applyLive(base, data) {
        const next = Object.assign({}, base);
        const live = num(data.regularMarketPrice);
        const prev = num(data.previousClose != null ? data.previousClose : data.regularMarketPreviousClose);
        if (prev == null && live == null) return null;
        if (live != null) next.live = live;
        const pre = num(data.preMarketPrice);
        const post = num(data.postMarketPrice);
        if (pre != null) next.overnight = pre;
        if (post != null) next.after_hours = post;
        const session = sessionFromClock(new Date());
        next.session = session;
        applyLastClose(next, data, session);
        next.quote_time_utc = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
        next.source = "finance-query.com";
        return next;
      }

      function splitFile(file) {
        if (file && file.quotes && (file.quotes.tsla || file.quotes.spcx)) {
          return {
            quotes: {
              tsla: file.quotes.tsla || null,
              spcx: file.quotes.spcx || null
            },
            musk_stack: file.musk_stack,
            x_news: file.x_news,
            voices: file.voices,
            voices_url: file.voices_url
          };
        }
        return {
          quotes: { tsla: file, spcx: null },
          musk_stack: file && file.musk_stack,
          x_news: file && file.x_news,
          voices: file && file.voices,
          voices_url: file && file.voices_url
        };
      }

      function renderAll() {
        renderCard(cards.tsla, quoteState.quotes.tsla);
        renderCard(cards.spcx, quoteState.quotes.spcx);
        renderVoices(quoteState);
        renderHeadlines(Array.isArray(quoteState.x_news) ? quoteState.x_news : null);
        renderStack(Array.isArray(quoteState.musk_stack) ? quoteState.musk_stack : null);
        applyTeslaStatus();
        const bits = [];
        ["tsla", "spcx"].forEach(function (key) {
          const q = quoteState.quotes[key];
          if (!q || !Number.isFinite(Number(q.last_close))) return;
          bits.push((q.symbol || key.toUpperCase()) + " last close $" + money(Number(q.last_close)));
        });
        el.liveRegion.textContent = bits.join(". ") + (bits.length ? "." : "");
      }

      function renderMissing() {
        blankCard(cards.tsla, "The data file is missing.");
        blankCard(cards.spcx, "The data file is missing.");
        setSessionClock("CLOSED");
        renderVoices({ voices: DEFAULT_VOICES });
        renderHeadlines(null);
        renderStack(DEFAULT_STACK);
        el.liveRegion.textContent = "The data file is missing.";
      }

      let quoteState = null;
      let refreshTimer = null;

      async function refreshOne(key) {
        if (!quoteState || !quoteState.quotes) return;
        const base = quoteState.quotes[key];
        if (!base) return;
        try {
          const res = await fetch(LIVE_URL[key], { cache: "no-store" });
          if (!res.ok) throw new Error("live http");
          const data = await res.json();
          const payload = Array.isArray(data) ? data[0] : data;
          const next = applyLive(base, payload || {});
          if (!next) throw new Error("live shape");
          quoteState.quotes[key] = next;
        } catch (err) {
          /* keep JSON numbers */
        }
      }

      async function refreshLive() {
        if (!quoteState) return;
        await Promise.all([refreshOne("tsla"), refreshOne("spcx")]);
        renderAll();
        scheduleRefresh();
      }

      function scheduleRefresh() {
        if (refreshTimer) clearTimeout(refreshTimer);
        const open = sessionFromClock(new Date()) === "OPEN";
        refreshTimer = setTimeout(refreshLive, open ? 60000 : 5 * 60000);
      }

      function chartCloses(data) {
        let candles = null;
        if (Array.isArray(data)) candles = data;
        else if (data && Array.isArray(data.candles)) candles = data.candles;
        else if (data && data.chart && data.chart.result && data.chart.result[0]) {
          const r = data.chart.result[0];
          const q = r.indicators && r.indicators.quote && r.indicators.quote[0];
          candles = q && Array.isArray(q.close) ? q.close.map(function (c) { return { close: c }; }) : [];
        }
        const closes = [];
        (candles || []).forEach(function (c) {
          const n = num(c && (c.close != null ? c.close : c));
          if (n != null) closes.push(n);
        });
        if (closes.length >= 6) return closes.slice(-6, -1);
        if (closes.length >= 5) return closes.slice(-5);
        return closes;
      }

      async function ensureCloses(key) {
        if (!quoteState || !quoteState.quotes) return;
        const q = quoteState.quotes[key];
        if (!q) return;
        const have = Array.isArray(q.closes_5d) ? q.closes_5d.map(Number).filter(Number.isFinite) : [];
        if (have.length >= 2) return;
        const sym = q.symbol || String(key).toUpperCase();
        try {
          const res = await fetch("https://finance-query.com/v2/chart/" + encodeURIComponent(sym) + "?interval=1d&range=1mo", { cache: "no-store" });
          if (!res.ok) throw new Error("chart http");
          const series = chartCloses(await res.json());
          if (series.length >= 2) q.closes_5d = series;
        } catch (err) {
          /* keep missing rather than invent */
        }
      }

      async function load() {
        cards.tsla.status.textContent = "Loading";
        cards.tsla.status.className = "status loading";
        cards.spcx.status.textContent = "Loading";
        cards.spcx.status.className = "status loading";
        try {
          const res = await fetch("./quote.json", { cache: "no-store" });
          if (!res.ok) throw new Error("missing");
          quoteState = splitFile(await res.json());
          await ensureCloses("spcx");
          renderAll();
          requestAnimationFrame(function () {
            Object.keys(cards).forEach(function (key) {
              const card = cards[key];
              if (card.sparkValues.length >= 2) sparkSvg(card, card.sparkValues);
            });
          });
          refreshLive();
        } catch (err) {
          renderMissing();
        }
      }

      tickClock();
      setInterval(tickClock, 1000);
      if (window.ResizeObserver) {
        Object.keys(cards).forEach(function (key) {
          const card = cards[key];
          new ResizeObserver(function () {
            if (card.sparkValues.length >= 2) sparkSvg(card, card.sparkValues);
          }).observe(card.spark);
        });
      }
      load();
    })();

  </script>
