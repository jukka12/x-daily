<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X DAILY — TSLA · SPCX</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="icon" href="./favicon.ico">
  <style>
    :root {
      --bg: #0c0c0d;
      --fg: #f3f3f1;
      --muted: #8a8a86;
      --line: #2a2a2c;
      --chip: #3a3a3c;
      --up: #3ecf8e;
      --down: #e24b4b;
      --live-bg: #1f7a4d;
      --warn: #e6c56a;
      --flat: #e6c56a;
      --purple: #b794f6;
      --spark: #8b8b87;
      --sep: #5c5c58;
      --soft: #c8c8c3;
      --soft-strong: #d8d8d3;
      --hover-line: #4a4a4c;
      --track: #2a2a2c;
      --knob: #c8c8c3;
      --status-fg: #ffffff;
      --error-border: #6a5414;
      --unverified: #7a7a76;
      --border-w: 1px;
    }

    /* Light: deeper greens/reds/gold/purple so Colors stay readable on pale bg */
    html.theme-light {
      --bg: #f4f3ef;
      --fg: #1c1c1e;
      --muted: #6a6a64;
      --line: #c4c3bb;
      --chip: #9e9d94;
      --up: #0b8f62;
      --down: #c62828;
      --live-bg: #0b7a54;
      --warn: #a67c00;
      --flat: #a67c00;
      --purple: #6b4db8;
      --spark: #7a7a74;
      --sep: #a8a89f;
      --soft: #4a4a46;
      --soft-strong: #2e2e2c;
      --hover-line: #7a7970;
      --track: #e2e1da;
      --knob: #5a5a56;
      --status-fg: #ffffff;
      --error-border: #c9a227;
      --unverified: #8a8a84;
      --border-w: 2px;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    html.theme-light, html.theme-light body { color-scheme: light; }

    body {
      padding: 32px 28px 48px;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .pair {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: stretch;
    }

    .col-tsla {
      padding-right: 40px;
      border-right: var(--border-w) solid var(--line);
    }
    .col-spcx { padding-left: 40px; }

    .band {
      margin-top: 32px;
      padding-top: 22px;
      border-top: var(--border-w) solid var(--line);
    }

    .clock-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 22px;
      padding-bottom: 18px;
      border-bottom: var(--border-w) solid var(--line);
      font-size: 0.86rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      line-height: 1.45;
    }
    .clock-bar-left { min-width: 0; }
    .clock-bar .sep { margin: 0 0.35em; color: var(--sep); }
    .clock-bar .sess { color: var(--muted); font-weight: 650; letter-spacing: 0.06em; }
    .clock-bar .sess.open { color: var(--up); }
    .clock-bar .sess.pre { color: var(--warn); }

    .clock-bar-right {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Icon-only controls — symbol only, no chrome */
    .theme-toggle,
    .tone-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.15s ease, opacity 0.15s ease;
    }
    .theme-toggle { color: var(--flat); }
    .theme-toggle:hover,
    .tone-toggle:hover { opacity: 0.8; }
    .theme-toggle:focus-visible,
    .tone-toggle:focus-visible {
      outline: 2px solid var(--flat);
      outline-offset: 3px;
    }
    .theme-toggle svg,
    .tone-toggle svg { width: 20px; height: 20px; display: block; }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    html.theme-light .theme-toggle .icon-sun { display: block; }
    html.theme-light .theme-toggle .icon-moon { display: none; }

    /* Colors ball: same visual size as theme icon, grey off / green on */
    .tone-toggle { color: var(--muted); }
    html.tone-on .tone-toggle { color: var(--up); }
    .tone-toggle .tone-ball {
      fill: currentColor;
    }


    /* Tone colors only when html.tone-on — stock cards keep always-on colors */
    html:not(.tone-on) .headline.up,
    html:not(.tone-on) .headline.down,
    html:not(.tone-on) .headline.flat { color: var(--fg); }
    html:not(.tone-on) .headline.up:hover,
    html:not(.tone-on) .headline.down:hover { filter: none; color: var(--fg); }

    html:not(.tone-on) .chip-status.up,
    html:not(.tone-on) .chip-status.down,
    html:not(.tone-on) .chip-status.flat { color: var(--muted); }
    html:not(.tone-on) a.chip-status.up:hover,
    html:not(.tone-on) a.chip-status.down:hover,
    html:not(.tone-on) a.chip-status.flat:hover { filter: none; color: var(--fg); }

    html:not(.tone-on) .chip-name.up,
    html:not(.tone-on) .chip-name.down,
    html:not(.tone-on) .chip-name.flat { color: var(--fg); }
    html:not(.tone-on) a.chip-name.up:hover,
    html:not(.tone-on) a.chip-name.down:hover,
    html:not(.tone-on) a.chip-name.flat:hover { filter: none; color: var(--fg); }

    html:not(.tone-on) .briefing-p.up,
    html:not(.tone-on) .briefing-p.down,
    html:not(.tone-on) .briefing-p.flat { color: var(--soft); }

    html:not(.tone-on) .odds-pct.up,
    html:not(.tone-on) .odds-pct.down,
    html:not(.tone-on) .odds-pct.flat { color: var(--fg); }
    html:not(.tone-on) .odds-delta.up,
    html:not(.tone-on) .odds-delta.down { color: var(--muted); }

    html:not(.tone-on) .pt-target.up,
    html:not(.tone-on) .pt-target.down,
    html:not(.tone-on) .pt-target.flat { color: var(--fg); }
    html:not(.tone-on) .pt-delta.up,
    html:not(.tone-on) .pt-delta.down { color: var(--muted); }
    html:not(.tone-on) .pt-consensus.up,
    html:not(.tone-on) .pt-consensus.down,
    html:not(.tone-on) .pt-consensus.flat { color: var(--fg); }
    html:not(.tone-on) .pt-consensus .pt-delta.up,
    html:not(.tone-on) .pt-consensus .pt-delta.down { color: var(--muted); }

    /* Stock cards: green/red always — never gated by Colors */
    html:not(.tone-on) .price.up { color: var(--up); }
    html:not(.tone-on) .price.down { color: var(--down); }
    html:not(.tone-on) .price.flat { color: var(--fg); }
    html:not(.tone-on) .today-block.up .today-label,
    html:not(.tone-on) .today-block.up .today-pct { color: var(--up); }
    html:not(.tone-on) .today-block.down .today-label,
    html:not(.tone-on) .today-block.down .today-pct { color: var(--down); }
    html:not(.tone-on) .today-block.flat .today-label { color: var(--muted); }
    html:not(.tone-on) .today-block.flat .today-pct { color: var(--fg); }

    .kicker {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .ticker {
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    .status {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 5px 10px;
      border: var(--border-w) solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      white-space: nowrap;
      line-height: 1;
    }

    .status.live {
      color: var(--status-fg);
      background: var(--live-bg);
      border-color: var(--live-bg);
    }

    .status.error { color: var(--warn); border-color: var(--error-border); }
    .status.loading { color: var(--muted); }

    .clock {
      margin-top: 16px;
      font-size: 0.86rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      line-height: 1.45;
    }

    .clock .sep { margin: 0 0.35em; color: var(--sep); }

    .clock .sess { color: var(--muted); font-weight: 650; letter-spacing: 0.06em; }
    .clock .sess.open { color: var(--up); }
    .clock .sess.pre { color: var(--warn); }

    .price-block { margin-top: 28px; }

    .label {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .price {
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.8rem, 7vw, 4.4rem);
      font-weight: 560;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--fg);
    }
    .price.up { color: var(--up); }
    .price.down { color: var(--down); }
    .price.flat { color: var(--fg); }

    .date {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    .spark {
      display: block;
      margin: 18px 0 4px;
      width: 100%;
      height: 52px;
      min-height: 52px;
    }

    .spark svg { display: block; width: 100%; height: 100%; }
    .spark:empty { visibility: hidden; }

    .today-block { margin-top: 22px; }

    .today-row {
      display: flex;
      align-items: baseline;
      gap: 18px;
    }

    .today-label {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 650;
    }

    .today-pct {
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.45rem, 3.4vw, 1.85rem);
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .today-block.up .today-label,
    .today-block.up .today-pct { color: var(--up); }
    .today-block.down .today-label,
    .today-block.down .today-pct { color: var(--down); }
    .today-block.flat .today-label { color: var(--muted); }
    .today-block.flat .today-pct { color: var(--fg); }

    .gap {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.92rem;
      font-variant-numeric: tabular-nums;
    }

    dl.facts {
      margin: 28px 0 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }

    dl.facts dt {
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.68rem;
      padding-top: 3px;
    }

    dl.facts dd {
      margin: 0;
      color: var(--soft-strong);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .section-label {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 14px;
    }
    html.tone-on .section-label { color: var(--purple); }


    /* odds */
    .odds-meta {
      margin: -6px 0 12px;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .odds-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
    }
    .odds-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 0;
      padding: 10px 8px;
      border: var(--border-w) solid var(--chip);
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      line-height: 1.15;
    }
    .odds-cell:hover { border-color: var(--hover-line); }
    .odds-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    html.tone-on .odds-cell:has(.odds-pct.up) .odds-label,
    html.tone-on .odds-cell:has(.odds-pct.flat) .odds-label { color: var(--up); }
    html.tone-on .odds-cell:has(.odds-pct.down) .odds-label { color: var(--down); }
    .odds-pct {
      font-size: 1.05rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    .odds-pct.up, .odds-pct.flat { color: var(--up); }
    .odds-pct.down { color: var(--down); }
    .odds-delta {
      font-size: 0.62rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      min-height: 0.85em;
    }
    .odds-delta.up { color: var(--up); }
    .odds-delta.down { color: var(--down); }
    .odds-deadline {
      font-size: 0.58rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .odds-empty {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
    }
    @media (max-width: 720px) {
      .odds-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .briefing-meta {
      margin: -6px 0 14px;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    .briefing-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px 28px;
      width: 100%;
    }

    .briefing-col { min-width: 0; }

    .briefing-subhead {
      margin: 0 0 10px;
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    html.tone-on .briefing-subhead { color: var(--purple); }

    .briefing-body { margin: 0; }

    .briefing-p {
      margin: 0 0 0.85em;
      font-size: 0.92rem;
      line-height: 1.55;
      color: var(--soft);
    }

    .briefing-p.up { color: var(--up); }
    .briefing-p.down { color: var(--down); }
    .briefing-p.flat { color: var(--flat); }

    .briefing-p:last-child { margin-bottom: 0; }

    .briefing-sources {
      margin: 14px 0 0;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .briefing-sources a {
      color: inherit;
      text-decoration: none;
    }
    .briefing-sources a:hover { text-decoration: underline; }

    .briefing-empty {
      margin: 0;
      font-size: 0.92rem;
      color: var(--muted);
      grid-column: 1 / -1;
    }


    .chips {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    .chip, .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: var(--border-w) solid var(--chip);
      border-radius: 18px;
      font-size: 0.86rem;
      color: var(--fg);
      line-height: 1.2;
      text-decoration: none;
      box-sizing: border-box;
      text-align: center;
    }

    .chip:hover, .tile:hover { border-color: var(--hover-line); }

    .chip-name {
      font-weight: 560;
      color: var(--fg);
      text-decoration: none;
    }
    .chip-name.up { color: var(--up); }
    .chip-name.down { color: var(--down); }
    .chip-name.flat { color: var(--flat); }
    a.chip-name:hover { text-decoration: underline; }
    a.chip-name.up:hover,
    a.chip-name.down:hover,
    a.chip-name.flat:hover { filter: brightness(1.12); }
    .chip-status {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
    }
    a.chip-status:hover { color: var(--fg); }

    .chip-status.up { color: var(--up); }
    .chip-status.down { color: var(--down); }
    .chip-status.flat { color: var(--flat); }
    a.chip-status.up:hover,
    a.chip-status.down:hover,
    a.chip-status.flat:hover { filter: brightness(1.12); }

    .chip-status.dead { pointer-events: none; }
    .chip-date {
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .chip .unverified {
      color: var(--unverified);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }


    .headlines {
      display: grid;
      grid-template-columns: 1fr;
      column-gap: 28px;
      row-gap: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--chip);
    }

    .headlines li {
      border-bottom: 1px solid var(--chip);
      margin: 0;
      padding: 0;
      min-width: 0;
    }

    /* Laptop / wide: two columns; narrow stays one */
    @media (min-width: 901px) {
      .headlines {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
    }

    .headline {
      display: block;
      padding: 10px 0;
      border: 0;
      border-radius: 0;
      color: var(--fg);
      text-decoration: none;
      line-height: 1.4;
      font-size: 0.95rem;
      font-weight: 450;
      box-sizing: border-box;
    }

    .headline:hover {
      color: var(--status-fg);
      text-decoration: underline;
    }

    .headline.up { color: var(--up); }
    .headline.down { color: var(--down); }
    .headline.flat { color: var(--flat); }
    .headline.up:hover,
    .headline.down:hover { filter: brightness(1.15); text-decoration: underline; }


    .stack-wrap { margin-top: 0; }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .stack-row {
      display: grid;
      gap: 10px;
      width: 100%;
    }

    .stack-row.row-a { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stack-row.row-b { grid-template-columns: repeat(7, minmax(0, 1fr)); }


    .band, .voices, .chips, .stack, .stack-row {
      width: 100%;
      box-sizing: border-box;
    }

    .note {
      margin-top: 18px;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .note:empty { display: none; }
    .note.error { color: var(--warn); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }


    .pt-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      margin: 0 0 12px;
    }

    .pt-consensus {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border: var(--border-w) solid var(--chip);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
    }
    .pt-consensus.up,
    .pt-consensus.flat { color: var(--up); }
    .pt-consensus.down { color: var(--down); }
    .pt-consensus .pt-delta { margin-left: 2px; }

    .pt-source {
      margin: 0;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }
    .pt-source a {
      color: inherit;
      text-decoration: none;
    }
    .pt-source a:hover { text-decoration: underline; }

    .pt-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
    }

    .pt-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 0;
      padding: 8px 6px;
      border: var(--border-w) solid var(--chip);
      border-radius: 12px;
      text-align: center;
      line-height: 1.15;
    }

    .pt-name {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    html.tone-on .pt-cell:has(.pt-target.up) .pt-name,
    html.tone-on .pt-cell:has(.pt-target.flat) .pt-name { color: var(--up); }
    html.tone-on .pt-cell:has(.pt-target.down) .pt-name { color: var(--down); }

      function money(n) {

      function part(parts, type) {
        const p = parts.find(function (x) { return x.type === type; });
        return p ? p.value : "";
      }

      function formatHelsinki(date) {
        const parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Europe/Helsinki",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hourCycle: "h23"
        }).formatToParts(date);
        return part(parts, "hour") + ":" + part(parts, "minute") + ":" + part(parts, "second") + " "
          + part(parts, "day") + "." + part(parts, "month") + "." + part(parts, "year");
      }

      function formatHm(date, timeZone) {
        const parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: timeZone,
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).formatToParts(date);
        return part(parts, "hour") + ":" + part(parts, "minute");
      }

      function formatCloseDate(s) {
        if (s == null || s === "") return "";
        const m = String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return m[3] + "." + m[2] + "." + m[1];
        return String(s);
      }

      function parseUtc(s) {
        if (s == null || s === "") return null;
        const d = new Date(String(s));
        return Number.isNaN(d.getTime()) ? null : d;
      }

      function zonedWallToDate(year, monthIndex, day, hour, minute, timeZone) {
        const utcGuess = Date.UTC(year, monthIndex, day, hour, minute, 0);
        const fmt = new Intl.DateTimeFormat("en-US", {
          timeZone: timeZone,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hourCycle: "h23"
        });
        function offsetMs(ms) {
          const parts = fmt.formatToParts(new Date(ms));
          const asUTC = Date.UTC(
            Number(part(parts, "year")),
            Number(part(parts, "month")) - 1,
            Number(part(parts, "day")),
            Number(part(parts, "hour")),
            Number(part(parts, "minute")),
            Number(part(parts, "second"))
          );
          return asUTC - ms;
        }
        return new Date(utcGuess - offsetMs(utcGuess - offsetMs(utcGuess)));
      }

      function parseQuoteTimeEt(s) {
        if (s == null || s === "") return null;
        const m = String(s).trim().match(
          /^([A-Za-z]{3})\s+(\d{1,2}),\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)\s*ET$/i
        );
        if (!m) return null;
        const months = {
          Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5,
          Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11
        };
        const monthKey = m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase();
        const month = months[monthKey];
        if (month == null) return null;
        let hour = Number(m[4]);
        const ampm = m[6].toUpperCase();
        if (ampm === "PM" && hour !== 12) hour += 12;
        if (ampm === "AM" && hour === 12) hour = 0;
        return zonedWallToDate(Number(m[3]), month, Number(m[2]), hour, Number(m[5]), "America/New_York");
      }

      function quoteInstant(q) {
        return parseUtc(q.quote_time_utc) || parseQuoteTimeEt(q.quote_time_et);
      }

      function sparkSvg(card, values) {
        card.sparkValues = values || [];
        if (!card.spark || !card.sparkValues || card.sparkValues.length < 2) {
          if (card.spark) card.spark.innerHTML = "";
          return;
        }
        const host = card.spark.parentElement || card.spark;
        const rect = host.getBoundingClientRect();
        const w = Math.max(Math.round(card.spark.clientWidth || rect.width) || 320, 160);
        const h = 52;
        const padX = 7;
        const padY = 8;
        const min = Math.min.apply(null, card.sparkValues);
        const max = Math.max.apply(null, card.sparkValues);
        const span = max - min || 1;
        const pts = card.sparkValues.map(function (v, i) {
          const x = padX + (i / (card.sparkValues.length - 1)) * (w - padX * 2);
          const y = padY + (1 - (v - min) / span) * (h - padY * 2);
          return [x, y];
        });
        const firstClose = card.sparkValues[0];
        const lastClose = card.sparkValues[card.sparkValues.length - 1];
        const spanPct = firstClose !== 0 ? ((lastClose - firstClose) / firstClose) * 100 : 0;
        const styles = getComputedStyle(document.documentElement);
        const upColor = (styles.getPropertyValue("--up") || "#3ecf8e").trim();
        const downColor = (styles.getPropertyValue("--down") || "#e24b4b").trim();
        const flatColor = (styles.getPropertyValue("--spark") || "#8b8b87").trim();
        let stroke = flatColor;
        if (spanPct > 0.005) stroke = upColor;
        else if (spanPct < -0.005) stroke = downColor;
        const ptsAttr = pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
        let html = '<svg viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '" preserveAspectRatio="none">';
        html += '<polyline fill="none" stroke="' + stroke + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="' + ptsAttr + '"/>';
        pts.forEach(function (p) {
          html += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.7" fill="' + stroke + '"/>';
        });
        html += "</svg>";
        card.spark.innerHTML = html;
      }

      function safeUrl(s) {
        if (s == null || s === "") return "";
        const u = String(s);
        if (u.indexOf("https://") === 0 || u.indexOf("http://") === 0) return u;
        return "";
      }

      function padButtons(items, minCount, maxCount, filler) {
        const src = Array.isArray(items) ? items.filter(Boolean) : [];
        const list = src.slice(0, maxCount);
        while (list.length < minCount) list.push(filler);
        return list;
      }

      function itemLabel(item) {
        if (!item) return "";
        if (item.label != null) return String(item.label);

      }

      function liveQuote(item) {
        if (!item) return "";
        const q = item.quote != null ? String(item.quote).trim() : "";
        const low = q.toLowerCase();
        if (!q || low === "quiet" || low === "none today" || low === "after hours" || q === "—") return "";

      function quoteDay(item) {
        const raw = item && item.quote_date != null ? String(item.quote_date).trim() : "";
        const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!m) return "";
        const iso = m[1] + "-" + m[2] + "-" + m[3];
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Europe/Helsinki",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());
        const today = part(parts, "year") + "-" + part(parts, "month") + "-" + part(parts, "day");
        if (iso === today) return "";
        return m[3] + "." + m[2];
      }

      function twoPartButton(item, emptyText, className) {
        const node = document.createElement("div");
        node.className = className || "chip";
        const home = safeUrl(item && item.url);
        let qTone = item && item.tone;
        if (qTone !== "up" && qTone !== "down" && qTone !== "flat") qTone = "flat";
        const title = document.createElement(home ? "a" : "span");
        title.className = "chip-name " + qTone;
        title.textContent = itemLabel(item);
        if (home) {
          title.href = home;
          title.target = "_blank";
          title.rel = "noopener";
        }
        node.appendChild(title);
        if (item && item.unverified) {
          const tag = document.createElement("span");
          tag.className = "unverified";
          tag.textContent = "UNVERIFIED";
          node.appendChild(tag);
        }
        const text = liveQuote(item);
        const qurl = text ? safeUrl(item && item.quote_url) : "";
        const q = document.createElement(qurl ? "a" : "span");
        q.className = "chip-status " + qTone + (qurl ? "" : " dead");
        q.textContent = text;
        if (qurl) {
          q.href = qurl;
          q.target = "_blank";
          q.rel = "noopener";
        }
        if (text) node.appendChild(q);
        const day = text ? quoteDay(item) : "";

      function renderBriefingCol(title, section) {
        if (!section || typeof section !== "object") return null;
        const paras = [];
        if (Array.isArray(section.paragraphs) && section.paragraphs.length) {
          section.paragraphs.forEach(function (row) {
            if (!row) return;
            const t = row.text != null ? String(row.text).trim() : "";
            if (!t) return;
            let tone = row.tone;
            if (tone !== "up" && tone !== "down" && tone !== "flat") tone = "flat";
            paras.push({ text: t, tone: tone });
          });
        } else {
          const raw = section.body != null ? String(section.body) : "";
          raw.split("\n\n").forEach(function (chunk) {
            const t = chunk.trim();
            if (t) paras.push({ text: t, tone: "flat" });
          });
        }
        const links = [];
        const sources = Array.isArray(section.sources) ? section.sources : [];
        sources.forEach(function (src) {
          if (!src) return;
          const url = briefingXUrl(src.url);
          if (!url) return;
          let label = src.name != null ? String(src.name).trim() : "";
          if (!label && src.handle != null) label = String(src.handle).trim();
          if (!label) return;
          links.push({ url: url, label: label });
        });
        if (!paras.length && !links.length) return null;

        const col = document.createElement("div");
        col.className = "briefing-col";
        const h = document.createElement("h3");
        h.className = "briefing-subhead";
        h.textContent = title;
        col.appendChild(h);
        if (paras.length) {
          const body = document.createElement("div");
          body.className = "briefing-body";
          paras.forEach(function (row) {
            const p = document.createElement("p");
            p.className = "briefing-p " + row.tone;
            p.textContent = row.text;
            body.appendChild(p);
          });
          col.appendChild(body);
        }
        if (links.length) {
          const groups = [];
          const byLabel = {};
          links.forEach(function (item) {
            const key = item.label;
            if (!byLabel[key]) {
              byLabel[key] = { label: key, urls: [] };
              groups.push(byLabel[key]);
            }
            if (byLabel[key].urls.indexOf(item.url) < 0) byLabel[key].urls.push(item.url);
          });
          const line = document.createElement("p");
          line.className = "briefing-sources";
          line.appendChild(document.createTextNode("Sources: "));
          groups.forEach(function (g, gi) {
            if (gi) line.appendChild(document.createTextNode(", "));
            line.appendChild(document.createTextNode(g.label));
            if (g.urls.length === 1) {
              line.appendChild(document.createTextNode(" ("));
              const a = document.createElement("a");
              a.href = g.urls[0];
              a.target = "_blank";
              a.rel = "noopener";
              a.textContent = "1";
              line.appendChild(a);
              line.appendChild(document.createTextNode(")"));
            } else {
              line.appendChild(document.createTextNode(" ("));
              g.urls.forEach(function (url, ui) {
                if (ui) line.appendChild(document.createTextNode(", "));
                const a = document.createElement("a");
                a.href = url;
                a.target = "_blank";
                a.rel = "noopener";
                a.textContent = String(ui + 1);
                line.appendChild(a);
              });
              line.appendChild(document.createTextNode(")"));
            }
          });
          col.appendChild(line);
        }
        return col;
      }


      function formatPtDelta(change) {

      }

      function renderPriceTargets(file) {
        if (!el.priceTargets) return;
        const pt = file && file.price_targets;
        if (!pt || typeof pt !== "object" || Array.isArray(pt)) {
          if (el.ptConsensus) { el.ptConsensus.className = "pt-consensus"; el.ptConsensus.textContent = "Consensus —"; }
          if (el.ptSource) el.ptSource.textContent = "";
          el.priceTargets.innerHTML = "";
          const p = document.createElement("p");
          p.className = "pt-empty";
          p.textContent = "No price targets yet.";
          el.priceTargets.appendChild(p);
          return;
        }

        const consensus = Number(pt.consensus);
        if (el.ptConsensus) {
          el.ptConsensus.className = "pt-consensus";
          el.ptConsensus.innerHTML = "";
          if (!Number.isFinite(consensus)) {
            el.ptConsensus.textContent = "Consensus —";
          } else {
            let cDir = pt.consensus_direction;
            const cChange = pt.consensus_change;
            const cPrev = pt.consensus_previous == null ? null : Number(pt.consensus_previous);
            if (cDir !== "up" && cDir !== "down" && cDir !== "flat") {
              if (Number.isFinite(cPrev)) {
                const d = consensus - cPrev;
                cDir = d > 0 ? "up" : d < 0 ? "down" : "flat";
              } else if (typeof cChange === "number" && Number.isFinite(cChange)) {
                cDir = cChange > 0 ? "up" : cChange < 0 ? "down" : "flat";
              } else {
                cDir = "flat";
              }
            }
            el.ptConsensus.className = "pt-consensus " + cDir;
            el.ptConsensus.appendChild(document.createTextNode("Consensus $" + Math.round(consensus)));
            if (cDir === "up" || cDir === "down") {
              const delta = document.createElement("span");
              const ch = Number.isFinite(Number(cChange))
                ? Number(cChange)
                : (Number.isFinite(cPrev) ? consensus - cPrev : NaN);
              const text = formatPtDelta(ch);
              if (text) {
                delta.className = "pt-delta " + cDir;
                delta.textContent = text;
                el.ptConsensus.appendChild(delta);
              }
            }
          }
        }

        if (el.ptSource) {
          el.ptSource.innerHTML = "";
          const src = pt.source != null ? String(pt.source).trim() : "";
          const asOf = pt.as_of != null ? String(pt.as_of).trim() : "";
          const url = safeUrl(pt.source_url);
          const label = [src, asOf].filter(Boolean).join(" · ");
          if (label && url) {
            const a = document.createElement("a");
            a.href = url;
            a.target = "_blank";
            a.rel = "noopener";
            a.textContent = label;
            el.ptSource.appendChild(a);
          } else {
            el.ptSource.textContent = label;
          }
        }

        const analysts = Array.isArray(pt.analysts) ? pt.analysts : [];
        el.priceTargets.innerHTML = "";
        if (!analysts.length) {
          const p = document.createElement("p");
          p.className = "pt-empty";
          p.textContent = "No price targets yet.";
          el.priceTargets.appendChild(p);
          return;
        }

        analysts.forEach(function (row) {
          if (!row) return;
          const name = row.name != null ? String(row.name).trim() : "";
          const target = Number(row.target);
          if (!name || !Number.isFinite(target)) return;

          let direction = row.direction;
          const change = row.change;
          if (direction !== "up" && direction !== "down" && direction !== "flat") {
            if (typeof change === "number" && Number.isFinite(change)) {
              direction = change > 0 ? "up" : change < 0 ? "down" : "flat";
            } else {
              direction = "flat";
            }
          }

          const cell = document.createElement("div");
          cell.className = "pt-cell";

          const nameEl = document.createElement("span");
          nameEl.className = "pt-name";
          nameEl.textContent = name;
          cell.appendChild(nameEl);

          const tgt = document.createElement("span");
          tgt.className = "pt-target " + direction;
          tgt.textContent = String(Math.round(target));
          cell.appendChild(tgt);

          const delta = document.createElement("span");
          delta.className = "pt-delta";
          if (direction === "up" || direction === "down") {
            const text = formatPtDelta(Number(change));
            if (text) {
              delta.className = "pt-delta " + direction;
              delta.textContent = text;
            }
          }
          cell.appendChild(delta);

          el.priceTargets.appendChild(cell);
        });
      }

        card.price.textContent = "—";

        if (card.overnightValue) card.overnightValue.textContent = "—";
        card.status.textContent = "Closed";
        card.status.className = "status error";
        card.note.className = "note error";
        card.note.textContent = message || "The data file is missing.";

      function renderCard(card, q) {
        if (!q) {
          blankCard(card, "No quote yet.");
          return;
        }
        const lastClose = Number(q.last_close);
        if (!Number.isFinite(lastClose)) {
          blankCard(card, "The data file is missing.");
          return;
        }

        const overnight = q.overnight == null ? null : Number(q.overnight);
        const live = q.live == null ? null : Number(q.live);
        const afterHours = q.after_hours == null ? null : Number(q.after_hours);
        const hasOvernight = Number.isFinite(overnight);
        const hasLive = Number.isFinite(live);
        const hasAfter = Number.isFinite(afterHours);
        const session = sessionFromClock(new Date());

        let hero = lastClose;
        let heroLabel = "Last close";
        let fallback = "";
        if (session === "PREMARKET") {
          if (hasOvernight) { hero = overnight; heroLabel = "Premarket"; }
          else { fallback = "No premarket quote. Showing last close."; }
        } else if (session === "OPEN") {
          if (hasLive) { hero = live; heroLabel = "Live"; }
          else { fallback = "No live quote. Showing last close."; }
        } else if (session === "AFTERHOURS") {
          if (hasAfter) { hero = afterHours; heroLabel = "After hours"; }
          else { hero = lastClose; heroLabel = "After hours"; }
        }

        card.heroLabel.textContent = heroLabel;
        card.price.textContent = "$" + money(hero);
        card.price.setAttribute("aria-busy", "false");
        card.date.textContent = heroLabel === "Last close" ? formatCloseDate(q.last_close_date) : "";

        const showLastFact = heroLabel !== "Last close";
        card.lastCloseTerm.hidden = !showLastFact;
        card.lastCloseValue.hidden = !showLastFact;
        card.lastCloseValue.textContent = showLastFact ? "$" + money(lastClose) : "—";
        card.fallbackTerm.hidden = !fallback;
        card.fallbackValue.hidden = !fallback;
        card.fallbackTerm.textContent = fallback ? "Note" : "";
        card.fallbackValue.textContent = fallback;

        const series = Array.isArray(q.closes_5d)
          ? q.closes_5d.map(Number).filter(Number.isFinite)
          : [];
        sparkSvg(card, series);

        if (card.overnightValue) card.overnightValue.textContent = hasOvernight ? "$" + money(overnight) : "—";

        let todayPx = null;
        let refClose = lastClose;
        if (session === "PREMARKET") todayPx = hasOvernight ? overnight : null;
        else if (session === "OPEN") todayPx = hasLive ? live : null;
        else if (session === "AFTERHOURS") todayPx = hasAfter ? afterHours : lastClose;
        else {
          /* CLOSED: show last session move vs prior close (weekend / overnight) */
          todayPx = lastClose;
          if (series.length >= 2) {
            const tip = series[series.length - 1];
            const prior = series[series.length - 2];
            if (Math.abs(tip - lastClose) < 0.05 && Number.isFinite(prior) && prior !== 0) {
              refClose = prior;
            } else if (Number.isFinite(tip) && tip !== 0 && Math.abs(tip - lastClose) >= 0.05) {
              refClose = tip;
            }
          }
        }

        if (todayPx != null && refClose !== 0) {
          const diff = todayPx - refClose;
          const pct = (diff / refClose) * 100;
          const up = pct > 0.005;
          const down = pct < -0.005;
          const dir = up ? "up" : down ? "down" : "flat";
          const sign = up ? "+" : "";
          card.change.textContent = sign + pct.toFixed(2) + "%";
          card.todayBlock.className = "today-block " + dir;
          card.price.className = "price " + dir;
          const gapSign = diff > 0.005 ? "+" : "−";
          const gapAbs = money(Math.abs(diff));
          card.gap.textContent = "$" + money(refClose) + " → $" + money(todayPx)
            + " (" + (Math.abs(diff) < 0.005 ? "$0.00" : gapSign + "$" + gapAbs) + ")";
        } else {
          card.change.textContent = "—";
          card.todayBlock.className = "today-block flat";
          card.price.className = "price flat";
          card.gap.textContent = "—";
        }

        if (session === "OPEN") {
          card.status.textContent = "Live";
          card.status.className = "status live";
        } else if (session === "PREMARKET") {
          card.status.textContent = "Premarket";
          card.status.className = "status";
        } else if (session === "AFTERHOURS") {
          card.status.textContent = "After hours";
          card.status.className = "status";
        } else {
          card.status.textContent = "Last close";
          card.status.className = "status";
        }

        /* Quote time / Source rows removed from cards */
        card.note.className = "note";
        card.note.textContent = "";
      }

      function nyParts(date) {
        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).formatToParts(date);
        return {
          weekday: part(parts, "weekday"),
          hour: Number(part(parts, "hour")),
          minute: Number(part(parts, "minute"))
        };
      }

      function sessionFromClock(date) {
        const ny = nyParts(date || new Date());
        const mins = ny.hour * 60 + ny.minute;
        const weekday = ["Mon", "Tue", "Wed", "Thu", "Fri"].indexOf(ny.weekday) >= 0;
        if (!weekday) return "CLOSED";
        if (mins >= 4 * 60 && mins < 9 * 60 + 30) return "PREMARKET";
        if (mins >= 9 * 60 + 30 && mins < 16 * 60) return "OPEN";
        if (mins >= 16 * 60 && mins < 20 * 60) return "AFTERHOURS";
        return "CLOSED";
      }

      function num(v) {
        if (typeof v === "number" && Number.isFinite(v)) return v;
        if (v && typeof v === "object" && Number.isFinite(Number(v.raw))) return Number(v.raw);
        const n = Number(v);
        return Number.isFinite(n) ? n : null;
      }

      function nyYmd(date) {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/New_York",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(date);
        return part(parts, "year") + "-" + part(parts, "month") + "-" + part(parts, "day");
      }

      function epochToNyYmd(epoch) {
        const n = Number(epoch);
        if (!Number.isFinite(n) || n <= 0) return null;
        const ms = n < 1e12 ? n * 1000 : n;
        return nyYmd(new Date(ms));
      }

      function priorNyWeekday(ymd) {
        const bits = String(ymd).split("-").map(Number);
        let t = Date.UTC(bits[0], bits[1] - 1, bits[2], 16, 0, 0) - 24 * 3600 * 1000;
        for (let i = 0; i < 8; i++) {
          const dt = new Date(t);
          const ny = nyParts(dt);
          if (["Mon", "Tue", "Wed", "Thu", "Fri"].indexOf(ny.weekday) >= 0) return nyYmd(dt);
          t -= 24 * 3600 * 1000;
        }
        return ymd;
      }

      function appendCloseIfNew(q, price, date) {
        if (!Number.isFinite(price) || !date) return;
        if (q.last_close_date === date) return;
        const series = Array.isArray(q.closes_5d) ? q.closes_5d.map(Number).filter(Number.isFinite) : [];
        series.push(price);
        q.closes_5d = series.slice(-5);
      }

      function applyLastClose(next, data, session) {
        const prev = num(data.previousClose != null ? data.previousClose : data.regularMarketPreviousClose);
        const cash = num(data.regularMarketPrice);
        const cashDate = epochToNyYmd(data.regularMarketTime);
        const todayNy = nyYmd(new Date());
        if (session === "AFTERHOURS" || session === "CLOSED") {
          if (cash != null) {
            appendCloseIfNew(next, cash, cashDate || todayNy);
            next.last_close = cash;
            if (cashDate) next.last_close_date = cashDate;
          }
        } else {
          if (prev != null) next.last_close = prev;
          if (!next.last_close_date || next.last_close_date >= todayNy) {
            next.last_close_date = (cashDate && cashDate < todayNy) ? cashDate : priorNyWeekday(todayNy);
          } else if (cashDate && next.last_close_date < cashDate && cashDate < todayNy) {
            next.last_close_date = cashDate;
          }
        }
        if ((session === "AFTERHOURS" || session === "CLOSED") && cashDate && (!next.last_close_date || next.last_close_date < cashDate)) {
          next.last_close_date = cashDate;
        }
      }

      function applyLive(base, data) {
        const next = Object.assign({}, base);
        const live = num(data.regularMarketPrice);
        const prev = num(data.previousClose != null ? data.previousClose : data.regularMarketPreviousClose);
        if (prev == null && live == null) return null;
        if (live != null) next.live = live;
        const pre = num(data.preMarketPrice);
        const post = num(data.postMarketPrice);
        if (pre != null) next.overnight = pre;
        if (post != null) next.after_hours = post;
        const session = sessionFromClock(new Date());
        if (session === "CLOSED" && pre == null) next.overnight = null;
        next.session = session;
        applyLastClose(next, data, session);
        next.quote_time_utc = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
        next.source = "finance-query.com";
        return next;
      }

      function splitFile(file) {
        if (file && file.quotes && (file.quotes.tsla || file.quotes.spcx)) {
          return {
            quotes: {
              tsla: file.quotes.tsla || null,
              spcx: file.quotes.spcx || null
            },
            musk_stack: file.musk_stack,
            x_news: file.x_news,
            voices: file.voices,
            voices_url: file.voices_url,
            briefing: file.briefing,
            price_targets: file.price_targets,
            odds: file.odds
          };
        }
        return {
          quotes: { tsla: file, spcx: null },
          musk_stack: file && file.musk_stack,
          x_news: file && file.x_news,
          voices: file && file.voices,
          voices_url: file && file.voices_url,
          briefing: file && file.briefing,
          price_targets: file && file.price_targets,
          odds: file && file.odds
        };
      }

      function renderAll() {
        renderCard(cards.tsla, quoteState.quotes.tsla);
        renderCard(cards.spcx, quoteState.quotes.spcx);
        renderVoices(quoteState);
        renderPriceTargets(quoteState);
        renderOdds(quoteState);
        renderBriefing(quoteState);
        renderHeadlines(Array.isArray(quoteState.x_news) ? quoteState.x_news : null);
        renderStack(Array.isArray(quoteState.musk_stack) ? quoteState.musk_stack : null);
        applyTeslaStatus();
        const bits = [];
        ["tsla", "spcx"].forEach(function (key) {
          const q = quoteState.quotes[key];
          if (!q || !Number.isFinite(Number(q.last_close))) return;
          bits.push((q.symbol || key.toUpperCase()) + " last close $" + money(Number(q.last_close)));
        });
        el.liveRegion.textContent = bits.join(". ") + (bits.length ? "." : "");
      }

      function renderMissing() {
        blankCard(cards.tsla, "The data file is missing.");
        blankCard(cards.spcx, "The data file is missing.");
        setSessionClock("CLOSED");
        renderVoices({ voices: DEFAULT_VOICES });
        renderPriceTargets(null);
        renderOdds(null);
        renderBriefing(null);
        renderHeadlines(null);
        renderStack(DEFAULT_STACK);
        el.liveRegion.textContent = "The data file is missing.";
      }

      let quoteState = null;
      let refreshTimer = null;

      async function refreshOne(key) {
        if (!quoteState || !quoteState.quotes) return;
        const base = quoteState.quotes[key];
        if (!base) return;
        try {
          const res = await fetch(LIVE_URL[key], { cache: "no-store" });
          if (!res.ok) throw new Error("live http");
          const data = await res.json();
          const payload = Array.isArray(data) ? data[0] : data;
          const next = applyLive(base, payload || {});
          if (!next) throw new Error("live shape");
          quoteState.quotes[key] = next;
        } catch (err) {
          /* keep JSON numbers */
        }
      }

      async function refreshLive() {
        if (!quoteState) return;
        await Promise.all([refreshOne("tsla"), refreshOne("spcx")]);
        renderAll();
        scheduleRefresh();
      }

      function scheduleRefresh() {
        if (refreshTimer) clearTimeout(refreshTimer);
        const open = sessionFromClock(new Date()) === "OPEN";
        refreshTimer = setTimeout(refreshLive, open ? 60000 : 5 * 60000);
      }

      function chartCloses(data) {
        let candles = null;
        if (Array.isArray(data)) candles = data;
        else if (data && Array.isArray(data.candles)) candles = data.candles;
        else if (data && data.chart && data.chart.result && data.chart.result[0]) {
          const r = data.chart.result[0];
          const q = r.indicators && r.indicators.quote && r.indicators.quote[0];
          candles = q && Array.isArray(q.close) ? q.close.map(function (c) { return { close: c }; }) : [];
        }
        const closes = [];
        (candles || []).forEach(function (c) {
          const n = num(c && (c.close != null ? c.close : c));
          if (n != null) closes.push(n);
        });
        if (closes.length >= 6) return closes.slice(-6, -1);
        if (closes.length >= 5) return closes.slice(-5);
        return closes;
      }

      async function ensureCloses(key) {
        if (!quoteState || !quoteState.quotes) return;
        const q = quoteState.quotes[key];
        if (!q) return;
        const have = Array.isArray(q.closes_5d) ? q.closes_5d.map(Number).filter(Number.isFinite) : [];
        if (have.length >= 2) return;
        const sym = q.symbol || String(key).toUpperCase();
        try {
          const res = await fetch("https://finance-query.com/v2/chart/" + encodeURIComponent(sym) + "?interval=1d&range=1mo", { cache: "no-store" });
          if (!res.ok) throw new Error("chart http");
          const series = chartCloses(await res.json());
          if (series.length >= 2) q.closes_5d = series;
        } catch (err) {
          /* keep missing rather than invent */
        }
      }

      async function load() {
        cards.tsla.status.textContent = "Loading";
        cards.tsla.status.className = "status loading";
        cards.spcx.status.textContent = "Loading";
        cards.spcx.status.className = "status loading";
        try {
          const res = await fetch("./quote.json", { cache: "no-store" });
          if (!res.ok) throw new Error("missing");
          quoteState = splitFile(await res.json());
          await ensureCloses("spcx");
          renderAll();
          requestAnimationFrame(function () {
            Object.keys(cards).forEach(function (key) {
              const card = cards[key];
              if (card.sparkValues.length >= 2) sparkSvg(card, card.sparkValues);
            });
          });
          refreshLive();
        } catch (err) {
          renderMissing();
        }
      }

      (function initToneToggle() {
        const btn = document.getElementById("tone-toggle");
        if (!btn) return;
        function apply(on) {
          document.documentElement.classList.toggle("tone-on", on);
          try { localStorage.setItem("xdaily-tone-on", on ? "1" : "0"); } catch (e) {}
          btn.setAttribute("aria-pressed", on ? "true" : "false");
          btn.title = on ? "Turn colors off" : "Turn colors on";
        }
        let on = false;
        try { on = localStorage.getItem("xdaily-tone-on") === "1"; } catch (e) {}
        apply(on);
        btn.addEventListener("click", function () {
          apply(!document.documentElement.classList.contains("tone-on"));
        });
      })();

      (function initThemeToggle() {
        const btn = document.getElementById("theme-toggle");
        if (!btn) return;
        function apply(light) {
          document.documentElement.classList.toggle("theme-light", light);
          try { localStorage.setItem("xdaily-theme", light ? "light" : "dark"); } catch (e) {}
          btn.setAttribute("aria-pressed", light ? "true" : "false");
          btn.title = light ? "Switch to dark" : "Switch to light";
          requestAnimationFrame(function () {
            Object.keys(cards).forEach(function (key) {
              const card = cards[key];
              if (card.sparkValues && card.sparkValues.length >= 2) sparkSvg(card, card.sparkValues);
            });
          });
        }
        let light = false;
        try { light = localStorage.getItem("xdaily-theme") === "light"; } catch (e) {}
        apply(light);
        btn.addEventListener("click", function () {
          apply(!document.documentElement.classList.contains("theme-light"));
        });
      })();

      tickClock();
      setInterval(tickClock, 1000);
      if (window.ResizeObserver) {
        Object.keys(cards).forEach(function (key) {
          const card = cards[key];
          new ResizeObserver(function () {
            if (card.sparkValues.length >= 2) sparkSvg(card, card.sparkValues);
          }).observe(card.spark);
        });
      }
      load();
    })();

  </script>
</body>
</html>
