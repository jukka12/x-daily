<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesla Daily — TSLA</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0c0c0d;
      --fg: #f3f3f1;
      --muted: #8a8a86;
      --line: #2a2a2c;
      --up: #3ecf8e;
      --down: #e24b4b;
      --live: #6ee0b0;
      --warn: #e6c56a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    main {
      width: min(520px, 100%);
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    h1 {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .ticker {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    .status {
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      white-space: nowrap;
    }

    .status.live {
      color: var(--live);
      border-color: #245c46;
    }

    .status.error {
      color: var(--warn);
      border-color: #6a5414;
    }

    .status.loading {
      color: var(--muted);
    }

    .price-block {
      margin: 8px 0 22px;
    }

    .label {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .price {
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.1rem, 12vw, 5.4rem);
      font-weight: 560;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .price .currency {
      font-size: 0.42em;
      letter-spacing: 0;
      color: var(--muted);
      margin-right: 4px;
      vertical-align: 0.42em;
    }

    .date {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .change-block {
      border-top: 1px solid var(--line);
      padding: 22px 0 8px;
    }

    .change {
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .change.up { color: var(--up); }
    .change.down { color: var(--down); }
    .change.flat { color: var(--fg); }

    dl.facts {
      margin: 18px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }

    dl.facts dt {
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.68rem;
      padding-top: 3px;
    }

    dl.facts dd {
      margin: 0;
      color: #d8d8d3;
      font-variant-numeric: tabular-nums;
    }

    .note {
      margin-top: 18px;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .note:empty { display: none; }

    .note.error {
      color: var(--warn);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <h1>Tesla Daily</h1>
        <div class="ticker">TSLA · NASDAQ</div>
      </div>
      <div id="status" class="status loading" aria-live="polite">Loading</div>
    </header>

    <section class="price-block" aria-labelledby="close-label">
      <div id="close-label" class="label">Last close</div>
      <div id="close-price" class="price" aria-busy="true">—</div>
      <div id="close-date" class="date"></div>
    </section>

    <section class="change-block" aria-labelledby="today-label">
      <div id="today-label" class="label">Today</div>
      <div id="change" class="change flat">—</div>
    </section>

    <dl class="facts">
      <dt id="overnight-term" hidden>Overnight</dt>
      <dd id="overnight-value" hidden>—</dd>
      <dt id="live-term" hidden>Live</dt>
      <dd id="live-value" hidden>—</dd>
      <dt>Quote time</dt>
      <dd id="when">—</dd>
      <dt>Source</dt>
      <dd id="meta">—</dd>
    </dl>
    <p id="note" class="note"></p>
    <p class="sr-only" id="live-region" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      const el = {
        status: document.getElementById("status"),
        closePrice: document.getElementById("close-price"),
        closeDate: document.getElementById("close-date"),
        change: document.getElementById("change"),
        overnightTerm: document.getElementById("overnight-term"),
        overnightValue: document.getElementById("overnight-value"),
        liveTerm: document.getElementById("live-term"),
        liveValue: document.getElementById("live-value"),
        when: document.getElementById("when"),
        meta: document.getElementById("meta"),
        note: document.getElementById("note"),
        liveRegion: document.getElementById("live-region")
      };

      function money(n) {
        return n.toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      function setRow(term, value, show) {
        term.hidden = !show;
        value.hidden = !show;
        if (!show) value.textContent = "—";
      }

      function formatHelsinki(date) {
        const parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Europe/Helsinki",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hourCycle: "h23"
        }).formatToParts(date);
        const get = function (type) {
          const part = parts.find(function (p) { return p.type === type; });
          return part ? part.value : "";
        };
        return get("hour") + ":" + get("minute") + ":" + get("second") + " "
          + get("day") + "." + get("month") + "." + get("year");
      }

      function parseUtc(s) {
        if (s == null || s === "") return null;
        const d = new Date(String(s));
        return Number.isNaN(d.getTime()) ? null : d;
      }

      function zonedWallToDate(year, monthIndex, day, hour, minute, timeZone) {
        const utcGuess = Date.UTC(year, monthIndex, day, hour, minute, 0);
        const fmt = new Intl.DateTimeFormat("en-US", {
          timeZone: timeZone,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hourCycle: "h23"
        });

        function offsetMs(ms) {
          const parts = fmt.formatToParts(new Date(ms));
          const get = function (type) {
            const part = parts.find(function (p) { return p.type === type; });
            return part ? Number(part.value) : NaN;
          };
          const asUTC = Date.UTC(
            get("year"),
            get("month") - 1,
            get("day"),
            get("hour"),
            get("minute"),
            get("second")
          );
          return asUTC - ms;
        }

        return new Date(utcGuess - offsetMs(utcGuess - offsetMs(utcGuess)));
      }

      function parseQuoteTimeEt(s) {
        if (s == null || s === "") return null;
        const m = String(s).trim().match(
          /^([A-Za-z]{3})\s+(\d{1,2}),\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)\s*ET$/i
        );
        if (!m) return null;
        const months = {
          Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5,
          Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11
        };
        const monthKey = m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase();
        const month = months[monthKey];
        if (month == null) return null;
        let hour = Number(m[4]);
        const ampm = m[6].toUpperCase();
        if (ampm === "PM" && hour !== 12) hour += 12;
        if (ampm === "AM" && hour === 12) hour = 0;
        return zonedWallToDate(Number(m[3]), month, Number(m[2]), hour, Number(m[5]), "America/New_York");
      }

      function quoteInstant(q) {
        return parseUtc(q.quote_time_utc) || parseQuoteTimeEt(q.quote_time_et);
      }

      function clearPrices() {
        el.closePrice.textContent = "—";
        el.closePrice.setAttribute("aria-busy", "false");
        el.closeDate.textContent = "";
        el.change.textContent = "—";
        el.change.className = "change flat";
        setRow(el.overnightTerm, el.overnightValue, false);
        setRow(el.liveTerm, el.liveValue, false);
        el.when.textContent = "—";
        el.meta.textContent = "—";
      }

      function renderMissing() {
        clearPrices();
        el.status.textContent = "Data missing";
        el.status.className = "status error";
        el.note.className = "note error";
        el.note.textContent = "The data file is missing.";
        el.liveRegion.textContent = "The data file is missing.";
      }

      function render(q) {
        const lastClose = Number(q.last_close);
        if (!Number.isFinite(lastClose)) {
          renderMissing();
          return;
        }

        const overnight = q.overnight == null ? null : Number(q.overnight);
        const live = q.live == null ? null : Number(q.live);
        const hasOvernight = Number.isFinite(overnight);
        const hasLive = Number.isFinite(live);
        const session = String(q.session || "");

        el.closePrice.innerHTML = '<span class="currency">$</span>' + money(lastClose);
        el.closePrice.setAttribute("aria-busy", "false");
        el.closeDate.textContent = q.last_close_date ? String(q.last_close_date) : "";

        setRow(el.overnightTerm, el.overnightValue, hasOvernight);
        if (hasOvernight) el.overnightValue.textContent = "$" + money(overnight);

        setRow(el.liveTerm, el.liveValue, hasLive);
        if (hasLive) el.liveValue.textContent = "$" + money(live);

        let todayPx = null;
        if (session === "OPEN" && hasLive) todayPx = live;
        else if (hasOvernight) todayPx = overnight;

        if (todayPx != null && lastClose !== 0) {
          const pct = ((todayPx - lastClose) / lastClose) * 100;
          const up = pct > 0.005;
          const down = pct < -0.005;
          const sign = up ? "+" : "";
          el.change.textContent = sign + pct.toFixed(2) + "%";
          el.change.className = "change " + (up ? "up" : down ? "down" : "flat");
        } else {
          el.change.textContent = "—";
          el.change.className = "change flat";
        }

        if (session === "OPEN") {
          el.status.textContent = "Live";
          el.status.className = "status live";
        } else if (session === "PREMARKET") {
          el.status.textContent = "Overnight";
          el.status.className = "status";
        } else {
          el.status.textContent = "Closed";
          el.status.className = "status";
        }

        const when = quoteInstant(q);
        el.when.textContent = when ? formatHelsinki(when) : "—";
        el.meta.textContent = q.source ? String(q.source) : "—";
        el.note.className = "note";
        el.note.textContent = "";

        const parts = ["TSLA last close $" + money(lastClose)];
        if (q.last_close_date) parts[0] += " (" + q.last_close_date + ")";
        if (hasOvernight) parts.push("overnight $" + money(overnight));
        if (hasLive) parts.push("live $" + money(live));
        if (todayPx != null && lastClose !== 0) {
          const pct = ((todayPx - lastClose) / lastClose) * 100;
          const sign = pct > 0.005 ? "+" : "";
          parts.push("today " + sign + pct.toFixed(2) + "%");
        }
        el.liveRegion.textContent = parts.join(", ") + ".";
      }

      async function load() {
        el.status.textContent = "Loading";
        el.status.className = "status loading";
        try {
          const res = await fetch("./quote.json", { cache: "no-store" });
          if (!res.ok) throw new Error("missing");
          const quote = await res.json();
          render(quote);
        } catch (err) {
          renderMissing();
        }
      }

      load();
    })();
  </script>
</body>
</html>
